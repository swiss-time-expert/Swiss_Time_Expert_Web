<h2 id="barillet">2. Organe Moteur (Énergie) : Le Barillet &amp; Systèmes de Remontage</h2>
      <p>Le barillet est le composant central du stockage d'énergie potentielle du mouvement mécanique.</p>

      <!-- 3. MODELLO 3D INTERATTIVO CON ESPLOSO VERTICALE THREE.JS -->
      <div class="img-always-visible">
        <div class="interactive-wrapper" style="position: relative; background: #ffffff; border: 1px solid #dcdcdc; border-radius: 8px; padding: 15px;">
          
          <!-- Canvas Container per Three.js -->
          <div id="canvas-container-barillet" style="width: 100%; height: 450px; background-color: #ffffff; border-radius: 8px; position: relative; overflow: hidden;"></div>

          <!-- Slider di controllo dell'esploso verticale -->
          <div style="margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 6px; display: flex; align-items: center; gap: 15px;">
            <label for="exploder-barillet" style="font-size: 14px; font-weight: bold; color: #1a365d; white-space: nowrap;">⚙️ Contrôle de l'Exploso :</label>
            <input type="range" id="exploder-barillet" min="0" max="100" value="0" style="flex-grow: 1; cursor: pointer; accent-color: #1a365d;">
            <span id="val-scale-barillet" style="font-size: 13px; font-weight: bold; color: #6c757d; min-width: 40px;">0%</span>
          </div>

          <div class="img-caption" style="margin-top: 10px;">📷 VUE TECHNIQUE 3D — Anatomie du barillet et du ressort moteur (Modèle explosé interactif vertical).</div>
        </div>
      </div>

      <!-- Librerie Three.js necessarie per far funzionare l'esploso -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

      <script>
        (function() {
          let scene, camera, renderer, controls;
          let parts = [];
          const container = document.getElementById('canvas-container-barillet');

          if (!container) return;

          function initBarillet3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffffff); // Sfondo bianco coordinato con la pagina

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 25, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight1.position.set(20, 40, 20);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x88bbff, 0.6);
            dirLight2.position.set(-20, -20, -20);
            scene.add(dirLight2);

            const loader = new THREE.GLTFLoader();
            loader.load('../barillet_fix.glb', function (gltf) {
                const model = gltf.scene;
                scene.add(model);

                model.traverse((child) => {
                    if (child.isMesh) {
                        const initialPos = child.position.clone();
                        const name = child.name.toLowerCase();
                        let verticalOffset = 0;

                        if (name.includes('albero') || name.includes('shaft') || name.includes('asse')) {
                            verticalOffset = 22;
                        } else if (name.includes('coperchio') || name.includes('cover')) {
                            verticalOffset = 12;
                        } else if (name.includes('molla') || name.includes('spring')) {
                            verticalOffset = 2;
                        } else if (name.includes('tamburo') || name.includes('drum') || name.includes('ruota') || name.includes('wheel')) {
                            verticalOffset = -4;
                        } else {
                            verticalOffset = (initialPos.y >= 0) ? 8 : -4;
                        }

                        parts.push({
                            mesh: child,
                            initialPos: initialPos,
                            targetY: initialPos.y + verticalOffset
                        });
                    }
                });
            }, undefined, function (error) {
                console.error('Errore nel caricamento del file GLB del barilletto:', error);
            });

            const slider = document.getElementById('exploder-barillet');
            if (slider) {
                slider.addEventListener('input', (event) => {
                    const t = event.target.value / 100;
                    updateExplosion(t);
                    document.getElementById('val-scale-barillet').innerText = event.target.value + '%';
                });
            }

            window.addEventListener('resize', onWindowResize, false);
            animateBarillet();
          }

          function updateExplosion(t) {
            parts.forEach(p => {
                p.mesh.position.x = p.initialPos.x;
                p.mesh.position.z = p.initialPos.z;
                p.mesh.position.y = p.initialPos.y + (p.targetY - p.initialPos.y) * t;
            });
          }

          function onWindowResize() {
            if (!container) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
          }

          function animateBarillet() {
            requestAnimationFrame(animateBarillet);
            controls.update();
            renderer.render(scene, camera);
          }

          // Avvia l'inizializzazione al caricamento della pagina
          if (document.readyState === 'complete') {
              initBarillet3D();
          } else {
              window.addEventListener('load', initBarillet3D);
          }
        })();
      </script>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swiss Time Expert — Vue Éclatée 3D "Panino" (ETA 6498-1)</title>
  <link rel="icon" type="image/png" href="../favicon.png?v=2">
  <link rel="shortcut icon" type="image/png" href="../favicon.png?v=2">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at center, #1b263b 0%, #090d16 100%);
      color: #f8fafc;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #viewer {
      width: 100%;
      height: 100%;
      display: block;
    }
    body.mode-pan #viewer {
      cursor: grab;
    }
    body.mode-pan:active #viewer {
      cursor: grabbing;
    }
    #status {
      position: fixed;
      top: 14px;
      left: 14px;
      background: rgba(13, 19, 31, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 8px 13px;
      border-radius: 9px;
      font-size: 12px;
      line-height: 1.4;
      color: #e2e8f0;
      z-index: 10;
      pointer-events: none;
    }
    #controls {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 19, 31, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(212, 175, 55, 0.45);
      padding: 10px 16px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      width: min(540px, calc(100% - 24px));
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      z-index: 10;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      font-size: 12.5px;
      font-weight: 700;
      color: #f3c64f;
    }
    input[type="range"] {
      flex: 1;
      accent-color: #d4af37;
      cursor: pointer;
    }
    #explodeValue {
      color: #ffffff;
      min-width: 42px;
      text-align: right;
    }
    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      justify-content: center;
      width: 100%;
    }
    button {
      background: rgba(30, 41, 59, 0.92);
      color: #f8fafc;
      border: 1px solid #3b4c66;
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover {
      background: #2c3e55;
      border-color: #d4af37;
    }
    button.active {
      background: #b8860b;
      color: #ffffff;
      border-color: #f3c64f;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="status">Chargement de <code>../ETA_6498-1_Movement_parts.glb</code>...</div>
  <div id="viewer"></div>

  <div id="controls">
    <div class="slider-row">
      <span>⚙️ Vue Éclatée :</span>
      <input id="explodeSlider" type="range" min="0" max="1" step="0.005" value="0" />
      <span id="explodeValue">0%</span>
    </div>
    <div class="btn-row">
      <button id="btnRotate" class="active">⟳ Pivoter</button>
      <button id="btnPan">✋ Déplacer</button>
      <button id="btnZoomIn">🔍 +</button>
      <button id="btnZoomOut">🔍 −</button>
      <button id="btnAuto">↻ Auto</button>
      <button id="btnReset">Centrer</button>
      <button id="btnFullscreen" style="display:none;">⛶ Plein Écran</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const CANDIDATE_PATHS = [
      '../ETA_6498-1_Movement_parts.glb',
      '/ETA_6498-1_Movement_parts.glb',
      './ETA_6498-1_Movement_parts.glb'
    ];

    const HORIZONTAL_SPREAD = 1.65;
    const BASE_ROT = { x: -0.35, y: -0.55, z: 1.55 };
    const EXPLODE_ROT_DELTA = { x: -0.08, y: -0.45, z: 0.14 };

    const statusEl = document.getElementById('status');
    const container = document.getElementById('viewer');

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.005, 100);
    const BASE_CAM_DIST = 4.6;
    const CAM_DIR = new THREE.Vector3(0.0, 0.25, 1.0).normalize();
    camera.position.copy(CAM_DIR).multiplyScalar(BASE_CAM_DIST);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 2.05;
    container.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 1.5;

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.35);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.2);
    dirLight1.position.set(3, 5, 6);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffe6d5, 1.5);
    dirLight2.position.set(-4, -2, 5);
    scene.add(dirLight2);

    const fillLight3 = new THREE.DirectionalLight(0xdbeafe, 1.35);
    fillLight3.position.set(0, -5, -4);
    scene.add(fillLight3);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.035;
    controls.rotateSpeed = 0.75;
    controls.zoomSpeed = 1.15;
    controls.panSpeed = 0.85;
    controls.minDistance = 0.15;
    controls.maxDistance = 25.0;
    controls.target.set(0, 0, 0);

    let displayGroup = null;
    let modelRoot = null;
    let userZoomScale = 1.0;
    const explodeItems = [];
    const loader = new GLTFLoader();

    function getHierarchyLabel(obj) {
      const parts = [];
      let cur = obj;
      while (cur) {
        if (cur.name) parts.push(cur.name);
        cur = cur.parent;
      }
      return parts.join(' ').toLowerCase();
    }

    function getBlenderObjectNode(mesh) {
      let cur = mesh;
      while (cur && cur.parent && cur.parent !== modelRoot) {
        if (cur.name && cur.name.includes('Imported')) {
          return cur;
        }
        cur = cur.parent;
      }
      return mesh;
    }

    function getHorizontalStep(lbl) {
      if (lbl.includes('5125')) return 0.48;
      if (lbl.includes('5105')) return 0.58;
      if (lbl.includes('5110')) return 0.62;
      if (lbl.includes('5121')) return 0.80;
      if (lbl.includes('5415') || lbl.includes('5420') || lbl.includes('5425')) return 0.72;
      if (lbl.includes('5443') || lbl.includes('5445')) return -0.58;

      if (lbl.includes('100 main plate') || lbl.includes('100_main_plate')) return -0.78;
      if (lbl.includes('105m barrel bridge') || lbl.includes('105m_barrel_bridge')) return 0.42;
      if (lbl.includes('180 movement barrel') || lbl.includes('180_movement_barrel')) return -0.22;

      if (
        lbl.includes('250 hour') || lbl.includes('250_hour') ||
        lbl.includes('240 driver') || lbl.includes('240_driver') ||
        lbl.includes('260 minute') || lbl.includes('260_minute') ||
        lbl.includes('401 winding stem') || lbl.includes('401_winding_stem') ||
        lbl.includes('407 winding') || lbl.includes('407_winding') ||
        lbl.includes('410 sliding') || lbl.includes('410_sliding') ||
        lbl.includes('435 yoke') || lbl.includes('435_yoke') ||
        lbl.includes('440 yoke') || lbl.includes('440_yoke') ||
        lbl.includes('443m setting') || lbl.includes('443m_setting') ||
        lbl.includes('445m setting') || lbl.includes('445m_setting') ||
        lbl.includes('450 setting') || lbl.includes('450_setting') ||
        lbl.includes('453 intermediate') || lbl.includes('453_intermediate')
      ) {
        return -0.45;
      }

      if (
        lbl.includes('201 centre') || lbl.includes('201_centre') ||
        lbl.includes('210 third') || lbl.includes('210_third') ||
        lbl.includes('220 second') || lbl.includes('220_second')
      ) {
        return 0.02;
      }

      if (
        lbl.includes('705 escape') || lbl.includes('705_escape') ||
        lbl.includes('710 pallet') || lbl.includes('710_pallet') ||
        lbl.includes('721 balance') || lbl.includes('721_balance') ||
        lbl.includes('incabloc')
      ) {
        return 0.18;
      }

      if (lbl.includes('125 pallet bridge') || lbl.includes('125_pallet_bridge')) return 0.34;
      if (lbl.includes('110 train wheel bridge') || lbl.includes('110_train_wheel_bridge')) return 0.48;
      if (
        lbl.includes('121 balancing bridge') || lbl.includes('121_balancing_bridge') ||
        lbl.includes('303 two') || lbl.includes('303_two')
      ) {
        return 0.64;
      }

      if (
        lbl.includes('415 ratchet') || lbl.includes('415_ratchet') ||
        lbl.includes('420 crown') || lbl.includes('420_crown') ||
        lbl.includes('422 crown') || lbl.includes('422_crown') ||
        lbl.includes('425 click') || lbl.includes('425_click')
      ) {
        return 0.56;
      }

      if (lbl.includes('screw')) return 0.66;
      return 0.08;
    }

    function onModelLoaded(gltf) {
      modelRoot = gltf.scene;
      modelRoot.updateMatrixWorld(true);

      const coreBox = new THREE.Box3();
      const fullBox = new THREE.Box3();
      let meshCount = 0;

      modelRoot.traverse((child) => {
        if (!child.isMesh) return;
        meshCount++;
        fullBox.expandByObject(child);
        const lbl = getHierarchyLabel(child);
        if (!lbl.includes('401 winding stem') && !lbl.includes('401_winding_stem')) {
          coreBox.expandByObject(child);
        }
        if (child.material) {
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          for (const m of mats) {
            if (m) {
              m.side = THREE.DoubleSide;
              if ('envMapIntensity' in m) m.envMapIntensity = 1.65;
              m.needsUpdate = true;
            }
          }
        }
      });

      const refBox = coreBox.isEmpty() ? fullBox : coreBox;
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      refBox.getSize(size);
      refBox.getCenter(center);

      const stackAxis = (size.x <= size.y && size.x <= size.z) ? 'x'
                      : (size.y <= size.x && size.y <= size.z) ? 'y' : 'z';
      const localStackVec = new THREE.Vector3(
        stackAxis === 'x' ? 1 : 0,
        stackAxis === 'y' ? 1 : 0,
        stackAxis === 'z' ? 1 : 0
      );

      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const normScale = 2.35 / maxDim;

      modelRoot.scale.setScalar(normScale);
      modelRoot.position.copy(center).multiplyScalar(-normScale);

      displayGroup = new THREE.Group();
      displayGroup.add(modelRoot);
      displayGroup.rotation.order = 'YXZ';
      displayGroup.rotation.set(BASE_ROT.x, BASE_ROT.y, BASE_ROT.z);

      scene.add(displayGroup);
      scene.updateMatrixWorld(true);

      const worldSandwichAxis = localStackVec
        .clone()
        .transformDirection(modelRoot.matrixWorld)
        .normalize();

      const worldOrigin = new THREE.Vector3(0, 0, 0);
      const registeredNodes = new Set();

      modelRoot.traverse((child) => {
        if (!child.isMesh) return;

        const targetNode = getBlenderObjectNode(child);
        if (registeredNodes.has(targetNode)) return;
        registeredNodes.add(targetNode);

        const lbl = getHierarchyLabel(targetNode).replace(/_/g, ' ');
        const step = getHorizontalStep(lbl);
        const sandwichShift = step * HORIZONTAL_SPREAD;

        const targetWorld = worldSandwichAxis.clone().multiplyScalar(sandwichShift);
        const localOrigin = targetNode.parent ? targetNode.parent.worldToLocal(worldOrigin.clone()) : worldOrigin.clone();
        const localTarget = targetNode.parent ? targetNode.parent.worldToLocal(targetWorld.clone()) : targetWorld.clone();
        const localDelta = localTarget.sub(localOrigin);

        explodeItems.push({
          obj: targetNode,
          origPos: targetNode.position.clone(),
          deltaVec: localDelta
        });
      });

      statusEl.innerHTML =
        `<strong>ETA 6498-1 — Vue Éclatée "Panino"</strong> (${registeredNodes.size} pièces · ${meshCount} mailles)`;
    }

    function tryLoadFromIndex(index) {
      if (index >= CANDIDATE_PATHS.length) {
        statusEl.innerHTML = `<span style="color:#fca5a5;">Fichier <code>ETA_6498-1_Movement_parts.glb</code> introuvable.</span>`;
        return;
      }
      loader.load(
        CANDIDATE_PATHS[index],
        (gltf) => onModelLoaded(gltf),
        (xhr) => {
          if (xhr.total) {
            const pct = Math.round((xhr.loaded / xhr.total) * 100);
            statusEl.innerHTML = `Chargement : <strong>${pct}%</strong>`;
          }
        },
        () => tryLoadFromIndex(index + 1)
      );
    }

    tryLoadFromIndex(0);

    function applyExplodeState(rawT) {
      const easedT = rawT * rawT * (3 - 2 * rawT);
      for (const item of explodeItems) {
        item.obj.position.copy(item.origPos).addScaledVector(item.deltaVec, easedT);
      }

      if (displayGroup) {
        displayGroup.rotation.set(
          BASE_ROT.x + EXPLODE_ROT_DELTA.x * easedT,
          BASE_ROT.y + EXPLODE_ROT_DELTA.y * easedT,
          BASE_ROT.z + EXPLODE_ROT_DELTA.z * easedT
        );
      }

      const targetDist = Math.max(0.15, BASE_CAM_DIST * (1 + 0.35 * easedT) * userZoomScale);
      const dir = camera.position.clone().sub(controls.target).normalize();
      if (dir.lengthSq() < 0.0001) dir.copy(CAM_DIR);
      camera.position.copy(controls.target).addScaledVector(dir, targetDist);
    }

    const slider = document.getElementById('explodeSlider');
    const sliderVal = document.getElementById('explodeValue');
    slider.addEventListener('input', () => {
      const rawT = parseFloat(slider.value);
      sliderVal.textContent = `${Math.round(rawT * 100)}%`;
      applyExplodeState(rawT);
    });

    const btnRotate = document.getElementById('btnRotate');
    const btnPan = document.getElementById('btnPan');
    const btnAuto = document.getElementById('btnAuto');

    btnRotate.onclick = () => {
      controls.enableRotate = true;
      controls.enablePan = true;
      controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
      document.body.classList.remove('mode-pan');
      btnRotate.classList.add('active');
      btnPan.classList.remove('active');
    };
    btnPan.onclick = () => {
      controls.enableRotate = false;
      controls.enablePan = true;
      controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
      document.body.classList.add('mode-pan');
      btnPan.classList.add('active');
      btnRotate.classList.remove('active');
    };
    document.getElementById('btnZoomIn').onclick = () => {
      userZoomScale = Math.max(0.06, userZoomScale * 0.72);
      const rawT = parseFloat(slider.value);
      const easedT = rawT * rawT * (3 - 2 * rawT);
      const targetDist = Math.max(0.15, BASE_CAM_DIST * (1 + 0.35 * easedT) * userZoomScale);
      const dir = camera.position.clone().sub(controls.target).normalize();
      camera.position.copy(controls.target).addScaledVector(dir, targetDist);
    };
    document.getElementById('btnZoomOut').onclick = () => {
      userZoomScale = Math.min(3.5, userZoomScale * 1.25);
      const rawT = parseFloat(slider.value);
      const easedT = rawT * rawT * (3 - 2 * rawT);
      const targetDist = Math.max(0.15, BASE_CAM_DIST * (1 + 0.35 * easedT) * userZoomScale);
      const dir = camera.position.clone().sub(controls.target).normalize();
      camera.position.copy(controls.target).addScaledVector(dir, targetDist);
    };
    btnAuto.onclick = () => {
      controls.autoRotate = !controls.autoRotate;
      btnAuto.classList.toggle('active', controls.autoRotate);
    };
    document.getElementById('btnReset').onclick = () => {
      userZoomScale = 1.0;
      controls.target.set(0, 0, 0);
      const rawT = parseFloat(slider.value);
      const easedT = rawT * rawT * (3 - 2 * rawT);
      if (displayGroup) {
        displayGroup.rotation.set(
          BASE_ROT.x + EXPLODE_ROT_DELTA.x * easedT,
          BASE_ROT.y + EXPLODE_ROT_DELTA.y * easedT,
          BASE_ROT.z + EXPLODE_ROT_DELTA.z * easedT
        );
      }
      camera.position.copy(CAM_DIR).multiplyScalar(BASE_CAM_DIST * (1 + 0.35 * easedT));
      controls.update();
    };

    // Pulsante Plein Écran / Quitter solo quando aperto come pagina autonoma (non in iframe)
    const btnFullscreen = document.getElementById('btnFullscreen');
    if (window.self === window.top) {
      btnFullscreen.style.display = 'inline-block';
      btnFullscreen.onclick = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.().catch((e) => console.warn(e));
        } else {
          document.exitFullscreen?.();
        }
      };
      document.addEventListener('fullscreenchange', () => {
        const isFs = Boolean(document.fullscreenElement);
        btnFullscreen.textContent = isFs ? '✕ Quitter' : '⛶ Plein Écran';
        btnFullscreen.classList.toggle('active', isFs);
      });
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

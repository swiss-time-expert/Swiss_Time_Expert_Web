<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test 3D - ETA 6498-1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #141619;
      color: #f0f2f5;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #viewer { width: 100%; height: 100%; display: block; }
    #status {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(20, 22, 25, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 10;
    }
    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 22, 25, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 18px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      min-width: 340px;
      z-index: 10;
    }
    .slider-row { display: flex; align-items: center; gap: 12px; width: 100%; font-size: 13px; font-weight: 600; }
    input[type="range"] { flex: 1; accent-color: #d4af37; cursor: pointer; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    button {
      background: #262a30;
      color: #f0f2f5;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #323840; }
    button.active { background: #c99e28; color: #111; border-color: #e0b94b; font-weight: 600; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="status">Caricamento <code>ETA_6498-1_Movement_parts.glb</code>...</div>
  <div id="viewer"></div>

  <div id="controls">
    <div class="slider-row">
      <span>Vue Éclatée :</span>
      <input id="explodeSlider" type="range" min="0" max="1" step="0.005" value="0" />
      <span id="explodeValue">0%</span>
    </div>
    <div class="btn-row">
      <button id="btnRotate" class="active">Pivoter</button>
      <button id="btnPan">Déplacer</button>
      <button id="btnZoomIn">+ Zoom</button>
      <button id="btnZoomOut">- Zoom</button>
      <button id="btnAuto">Auto</button>
      <button id="btnReset">Centrer</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const CANDIDATE_PATHS = [
      '../ETA_6498-1_Movement_parts.glb',
      '/ETA_6498-1_Movement_parts.glb',
      './ETA_6498-1_Movement_parts.glb'
    ];

    // Escursione base ampia per valorizzare lo schermo pieno
    const BASE_EXPLODE_SPREAD = 8.5;

    const statusEl = document.getElementById('status');
    const container = document.getElementById('viewer');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181b20);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.set(2.8, 2.2, 3.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.8;
    container.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.4);
    dirLight1.position.set(4, 6, 5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xdde6ff, 0.9);
    dirLight2.position.set(-5, -3, -4);
    scene.add(dirLight2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    let modelRoot = null;
    const explodeItems = [];
    const loader = new GLTFLoader();

    function getHierarchyLabel(obj) {
      const parts = [];
      let cur = obj;
      while (cur) {
        if (cur.name) parts.push(cur.name);
        cur = cur.parent;
      }
      return parts.join(' ').toLowerCase();
    }

    function getCoherentMultiplier(label, matNameLower) {
      // 1. Bariletto tenuto chiuso e solidale (spostamento minimo uniforme)
      if (label.includes('180 movement barrel') || label.includes('barrel')) {
        return 0.15;
      }
      // 2. Antishock poco esploso per ora
      if (label.includes('incabloc')) {
        return 0.25;
      }
      // 3. Rubini e viti: piccoli distacchi coerenti
      if (matNameLower.includes('rubino') || label.includes('ruby') || label.includes('screw')) {
        return 0.35;
      }
      // 4. Treno del tempo e ancora tenuti insieme/allineati
      if (
        label.includes('201 centre') ||
        label.includes('210 third') ||
        label.includes('220 second') ||
        label.includes('705 escape') ||
        label.includes('710 pallet')
      ) {
        return 0.32;
      }
      // 5. Platina e ponti: massima apertura strutturale
      if (
        label.includes('100 main plate') ||
        label.includes('bridge') ||
        label.includes('pont')
      ) {
        return 1.0;
      }
      // 6. Altri componenti interni / centrali: apertura moderata
      return 0.45;
    }

    function onModelLoaded(gltf) {
      modelRoot = gltf.scene;
      scene.add(modelRoot);

      const box = new THREE.Box3().setFromObject(modelRoot);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);

      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      modelRoot.scale.setScalar(2.45 / maxDim);

      box.setFromObject(modelRoot);
      box.getCenter(center);
      modelRoot.position.sub(center);

      const normSize = new THREE.Vector3();
      box.getSize(normSize);
      const minAxis = (normSize.z <= normSize.x && normSize.z <= normSize.y) ? 'z'
                    : (normSize.y <= normSize.x && normSize.y <= normSize.z) ? 'y' : 'x';

      // Calcola un centro medio per il gruppo bariletto così resta chiuso e compatto
      const barrelMeshes = [];
      const barrelBox = new THREE.Box3();

      let meshCount = 0;
      modelRoot.traverse((child) => {
        if (child.isMesh) {
          meshCount++;
          if (child.material) {
            child.material.side = THREE.DoubleSide;
            child.material.needsUpdate = true;
          }
          const label = getHierarchyLabel(child);
          if (label.includes('180 movement barrel')) {
            barrelMeshes.push(child);
            barrelBox.expandByObject(child);
          }
        }
      });

      const barrelCenter = new THREE.Vector3();
      if (barrelMeshes.length > 0) {
        barrelBox.getCenter(barrelCenter);
      }

      modelRoot.traverse((child) => {
        if (child.isMesh) {
          const label = getHierarchyLabel(child);
          const matNameLower = (child.material && child.material.name) ? child.material.name.toLowerCase() : '';
          const mult = getCoherentMultiplier(label, matNameLower);

          const isBarrel = label.includes('180 movement barrel');
          let refCoord = 0;
          if (isBarrel && barrelMeshes.length > 0) {
            refCoord = barrelCenter[minAxis];
          } else {
            const meshBox = new THREE.Box3().setFromObject(child);
            const meshCenter = new THREE.Vector3();
            meshBox.getCenter(meshCenter);
            refCoord = meshCenter[minAxis];
          }

          explodeItems.push({
            obj: child,
            origPos: child.position.clone(),
            axis: minAxis,
            factor: refCoord * BASE_EXPLODE_SPREAD * mult
          });
        }
      });

      statusEl.innerHTML = `<strong>Modello caricato</strong> (${meshCount} parti | Asse: ${minAxis.toUpperCase()})`;
    }

    function tryLoadFromIndex(index) {
      if (index >= CANDIDATE_PATHS.length) {
        statusEl.innerHTML = `<span style="color:#ff6b6b;">File <code>ETA_6498-1_Movement_parts.glb</code> non trovato né fuori né dentro <code>/FR/</code>.</span>`;
        return;
      }

      const currentPath = CANDIDATE_PATHS[index];
      loader.load(
        currentPath,
        (gltf) => onModelLoaded(gltf),
        (xhr) => {
          if (xhr.total) {
            const pct = Math.round((xhr.loaded / xhr.total) * 100);
            statusEl.innerHTML = `Caricamento: <strong>${pct}%</strong>`;
          }
        },
        () => tryLoadFromIndex(index + 1)
      );
    }

    tryLoadFromIndex(0);

    const slider = document.getElementById('explodeSlider');
    const sliderVal = document.getElementById('explodeValue');
    slider.addEventListener('input', () => {
      const t = parseFloat(slider.value);
      sliderVal.textContent = `${Math.round(t * 100)}%`;
      const scaleX = modelRoot ? modelRoot.scale.x : 1;
      for (const item of explodeItems) {
        item.obj.position.copy(item.origPos);
        item.obj.position[item.axis] += (item.factor * t) / scaleX;
      }
    });

    const btnRotate = document.getElementById('btnRotate');
    const btnPan = document.getElementById('btnPan');
    const btnAuto = document.getElementById('btnAuto');

    btnRotate.onclick = () => {
      controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
      btnRotate.classList.add('active');
      btnPan.classList.remove('active');
    };
    btnPan.onclick = () => {
      controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
      btnPan.classList.add('active');
      btnRotate.classList.remove('active');
    };
    document.getElementById('btnZoomIn').onclick = () => camera.position.multiplyScalar(0.85);
    document.getElementById('btnZoomOut').onclick = () => camera.position.multiplyScalar(1.18);
    btnAuto.onclick = () => {
      controls.autoRotate = !controls.autoRotate;
      btnAuto.classList.toggle('active', controls.autoRotate);
    };
    document.getElementById('btnReset').onclick = () => {
      camera.position.set(2.8, 2.2, 3.2);
      controls.target.set(0, 0, 0);
      controls.update();
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

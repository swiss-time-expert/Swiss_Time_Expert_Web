<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test 3D - ETA 6498-1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #141619;
      color: #f0f2f5;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #viewer { width: 100%; height: 100%; display: block; }
    #status {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(20, 22, 25, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 10;
    }
    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 22, 25, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 18px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      min-width: 340px;
      z-index: 10;
    }
    .slider-row { display: flex; align-items: center; gap: 12px; width: 100%; font-size: 13px; font-weight: 600; }
    input[type="range"] { flex: 1; accent-color: #d4af37; cursor: pointer; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    button {
      background: #262a30;
      color: #f0f2f5;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #323840; }
    button.active { background: #c99e28; color: #111; border-color: #e0b94b; font-weight: 600; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="status">Caricamento <code>ETA_6498-1_Movement_parts.glb</code>...</div>
  <div id="viewer"></div>

  <div id="controls">
    <div class="slider-row">
      <span>Vue Éclatée :</span>
      <input id="explodeSlider" type="range" min="0" max="1" step="0.005" value="0" />
      <span id="explodeValue">0%</span>
    </div>
    <div class="btn-row">
      <button id="btnRotate" class="active">Pivoter</button>
      <button id="btnPan">Déplacer</button>
      <button id="btnZoomIn">+ Zoom</button>
      <button id="btnZoomOut">- Zoom</button>
      <button id="btnAuto">Auto</button>
      <button id="btnReset">Centrer</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const CANDIDATE_PATHS = [
      '../ETA_6498-1_Movement_parts.glb',
      '/ETA_6498-1_Movement_parts.glb',
      './ETA_6498-1_Movement_parts.glb'
    ];

    // Escursione orizzontale calibrata per restare sempre dentro lo schermo
    const HORIZONTAL_SPREAD = 1.15;

    // Offset orizzontali per gruppo (ordine di lettura e leggibilità del treno del tempo)
    const GROUP_OFFSETS = {
      rubini:    0.00,   // Fermi al loro posto per evitare effetti "proiettile"
      bariletto: -0.18,  // Chiuso e compatto
      antishock: 0.05,   // Contenuto in questa fase
      treno:     0.22,   // Treno del tempo e scappamento ben leggibili all'interno
      carica:    0.45,   // Ruote di carica / rimessa allineate
      viti:      0.55,   // Viti con distacco leggero
      platina:   -0.85,  // Platina "a fetta" tenuta vicina e ben leggibile
      ponti:     0.95,   // Ponti "a fetta" aperti per liberare il treno del tempo
      altro:     0.15
    };

    const statusEl = document.getElementById('status');
    const container = document.getElementById('viewer');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181b20);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 100);
    const DEFAULT_CAM_POS = new THREE.Vector3(0.0, 0.3, 4.4);
    camera.position.copy(DEFAULT_CAM_POS);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.9;
    container.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight1.position.set(3, 5, 6);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xdde6ff, 0.9);
    dirLight2.position.set(-4, -2, 4);
    scene.add(dirLight2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    let modelRoot = null;
    const explodeItems = [];
    const loader = new GLTFLoader();

    function getHierarchyLabel(obj) {
      const parts = [];
      let cur = obj;
      while (cur) {
        if (cur.name) parts.push(cur.name);
        cur = cur.parent;
      }
      return parts.join(' ').toLowerCase();
    }

    function getMaterialNames(child) {
      const names = [];
      if (!child.material) return '';
      if (Array.isArray(child.material)) {
        for (const m of child.material) if (m && m.name) names.push(m.name.toLowerCase());
      } else if (child.material.name) {
        names.push(child.material.name.toLowerCase());
      }
      return names.join(' ');
    }

    function classifyGroup(lbl, matNames) {
      if (matNames.includes('rubino') || lbl.includes('ruby')) return 'rubini';
      if (lbl.includes('180 movement barrel')) return 'bariletto';
      if (lbl.includes('incabloc')) return 'antishock';
      if (lbl.includes('100 main plate')) return 'platina';
      if (lbl.includes('bridge') || lbl.includes('pont')) return 'ponti';
      if (lbl.includes('screw')) return 'viti';
      if (
        lbl.includes('201 centre') ||
        lbl.includes('210 third') ||
        lbl.includes('220 second') ||
        lbl.includes('705 escape') ||
        lbl.includes('710 pallet') ||
        lbl.includes('721 balance')
      ) return 'treno';
      if (
        lbl.includes('401 winding stem') ||
        lbl.includes('407 winding') ||
        lbl.includes('410 sliding') ||
        lbl.includes('415 ratchet') ||
        lbl.includes('420 crown') ||
        lbl.includes('422 crown') ||
        lbl.includes('425 click') ||
        lbl.includes('435 yoke') ||
        lbl.includes('440 yoke') ||
        lbl.includes('443m setting') ||
        lbl.includes('445m setting') ||
        lbl.includes('450 setting') ||
        lbl.includes('453 intermediate')
      ) return 'carica';
      return 'altro';
    }

    function onModelLoaded(gltf) {
      modelRoot = gltf.scene;
      scene.add(modelRoot);

      // Mantiene l'orientamento naturale del modello senza ruotarlo
      modelRoot.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(modelRoot);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);

      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const scaleFactor = 2.4 / maxDim;
      modelRoot.scale.setScalar(scaleFactor);
      modelRoot.updateMatrixWorld(true);

      box.setFromObject(modelRoot);
      box.getCenter(center);
      modelRoot.position.sub(center);
      modelRoot.updateMatrixWorld(true);

      // Direzione orizzontale pura sullo schermo (asse X mondiale)
      const worldRight = new THREE.Vector3(1, 0, 0);

      modelRoot.traverse((child) => {
        if (!child.isMesh) return;
        if (child.material) {
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          for (const m of mats) {
            if (m) {
              m.side = THREE.DoubleSide;
              m.needsUpdate = true;
            }
          }
        }

        const lbl = getHierarchyLabel(child);
        const matNames = getMaterialNames(child);
        const grp = classifyGroup(lbl, matNames);
        const baseOffset = GROUP_OFFSETS[grp] ?? 0.0;

        // Micro-scalatura interna solo per i ponti così restano ordinati a fette
        let subStep = 0;
        if (grp === 'ponti') {
          if (lbl.includes('105m barrel')) subStep = -0.06;
          else if (lbl.includes('110 train')) subStep = 0.04;
          else if (lbl.includes('125 pallet')) subStep = 0.12;
          else if (lbl.includes('121 balancing')) subStep = 0.20;
        }

        const totalWorldX = (baseOffset + subStep) * HORIZONTAL_SPREAD;

        // Converte lo spostamento orizzontale (asse X mondo) nello spazio locale di child.parent
        const parentInvWorld = child.parent
          ? child.parent.matrixWorld.clone().invert()
          : new THREE.Matrix4().identity();
        const localDir = worldRight.clone().transformDirection(parentInvWorld);

        const parentScale = new THREE.Vector3(1, 1, 1);
        if (child.parent) child.parent.getWorldScale(parentScale);

        const localDelta = new THREE.Vector3(
          localDir.x * totalWorldX / (parentScale.x || 1),
          localDir.y * totalWorldX / (parentScale.y || 1),
          localDir.z * totalWorldX / (parentScale.z || 1)
        );

        explodeItems.push({
          obj: child,
          origPos: child.position.clone(),
          deltaVec: localDelta
        });
      });

      statusEl.innerHTML = `<strong>Modello caricato</strong> (Esploso orizzontale a gruppi)`;
    }

    function tryLoadFromIndex(index) {
      if (index >= CANDIDATE_PATHS.length) {
        statusEl.innerHTML = `<span style="color:#ff6b6b;">File <code>ETA_6498-1_Movement_parts.glb</code> non trovato.</span>`;
        return;
      }
      loader.load(
        CANDIDATE_PATHS[index],
        (gltf) => onModelLoaded(gltf),
        (xhr) => {
          if (xhr.total) {
            const pct = Math.round((xhr.loaded / xhr.total) * 100);
            statusEl.innerHTML = `Caricamento: <strong>${pct}%</strong>`;
          }
        },
        () => tryLoadFromIndex(index + 1)
      );
    }

    tryLoadFromIndex(0);

    const slider = document.getElementById('explodeSlider');
    const sliderVal = document.getElementById('explodeValue');
    slider.addEventListener('input', () => {
      const t = parseFloat(slider.value);
      sliderVal.textContent = `${Math.round(t * 100)}%`;
      for (const item of explodeItems) {
        item.obj.position.copy(item.origPos).addScaledVector(item.deltaVec, t);
      }
    });

    const btnRotate = document.getElementById('btnRotate');
    const btnPan = document.getElementById('btnPan');
    const btnAuto = document.getElementById('btnAuto');

    btnRotate.onclick = () => {
      controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
      btnRotate.classList.add('active');
      btnPan.classList.remove('active');
    };
    btnPan.onclick = () => {
      controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
      btnPan.classList.add('active');
      btnRotate.classList.remove('active');
    };
    document.getElementById('btnZoomIn').onclick = () => camera.position.multiplyScalar(0.85);
    document.getElementById('btnZoomOut').onclick = () => camera.position.multiplyScalar(1.18);
    btnAuto.onclick = () => {
      controls.autoRotate = !controls.autoRotate;
      btnAuto.classList.toggle('active', controls.autoRotate);
    };
    document.getElementById('btnReset').onclick = () => {
      camera.position.copy(DEFAULT_CAM_POS);
      controls.target.set(0, 0, 0);
      controls.update();
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

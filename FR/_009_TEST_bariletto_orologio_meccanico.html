<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bariletto - Orologeria Meccanica</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #ffffff; text-align: center; }
        p { color: #888; margin-bottom: 24px; text-align: center; }
        
        #canvas-container {
            width: 100%;
            max-width: 700px;
            height: 500px;
            background-color: #1a1a1a;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .controls-container {
            width: 100%;
            max-width: 700px;
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
        }

        .controls-container label {
            font-size: 14px;
            color: #bbb;
            font-weight: 500;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #d4af37;
            cursor: pointer;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <h1>Il Bariletto dell'Orologio Meccanico</h1>
    <p>Modello 3D interattivo in scala reale — Vista esplosa coassiale verticale</p>

    <div id="canvas-container"></div>

    <div class="controls-container">
        <label for="exploder">Muovi il cursore per aprire / esplodere il bariletto in verticale:</label>
        <input type="range" id="exploder" min="0" max="100" value="0">
    </div>

    <script>
        let scene, camera, renderer, controls;
        let parts = [];

        const container = document.getElementById('canvas-container');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 25, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight1.position.set(20, 40, 20);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x88bbff, 0.6);
            dirLight2.position.set(-20, -20, -20);
            scene.add(dirLight2);

            const loader = new THREE.GLTFLoader();
            loader.load('../bariletto_orologio_meccanico.main_design.glb', function (gltf) {
                const model = gltf.scene;
                scene.add(model);

                model.traverse((child) => {
                    if (child.isMesh) {
                        // Calcoliamo il bounding box per centrare geometricamente il pezzo sull'asse X e Z
                        child.geometry.computeBoundingBox();
                        const box = child.geometry.boundingBox;
                        const center = new THREE.Vector3();
                        box.getCenter(center);
                        
                        // Centriamo la geometria azzerando l'offset orizzontale sul piano XZ
                        child.geometry.translate(-center.x, 0, -center.z);

                        const initialY = child.position.y + center.y;
                        const name = child.name.toLowerCase();
                        
                        let verticalOffset = 0;

                        if (name.includes('albero') || name.includes('shaft') || name.includes('asse')) {
                            verticalOffset = 22;
                        } else if (name.includes('coperchio') || name.includes('cover')) {
                            verticalOffset = 12;
                        } else if (name.includes('molla') || name.includes('spring')) {
                            verticalOffset = 4;
                        } else if (name.includes('tamburo') || name.includes('drum') || name.includes('ruota') || name.includes('wheel')) {
                            verticalOffset = -4;
                        } else {
                            verticalOffset = (initialY >= 0) ? 8 : -3;
                        }

                        parts.push({
                            mesh: child,
                            initialY: initialY,
                            targetY: initialY + verticalOffset
                        });
                    }
                });

                console.log("Componenti coassiali perfettamente centrati:", parts.length);
            }, undefined, function (error) {
                console.error('Errore nel caricamento del file GLB:', error);
            });

            const slider = document.getElementById('exploder');
            slider.addEventListener('input', (event) => {
                const t = event.target.value / 100;
                updateExplosion(t);
            });

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        // Posizionamento coassiale forzato a 0 su X e Z, con movimento fluido verticale su Y
        function updateExplosion(t) {
            parts.forEach(p => {
                p.mesh.position.x = 0;
                p.mesh.position.z = 0;
                p.mesh.position.y = p.initialY + (p.targetY - p.initialY) * t;
            });
        }

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>

</body>
</html>

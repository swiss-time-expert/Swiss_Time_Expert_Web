<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test 3D - ETA 6498-1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #141619;
      color: #f0f2f5;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #viewer { width: 100%; height: 100%; display: block; }
    #status {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(20, 22, 25, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 10;
    }
    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 22, 25, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 18px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      min-width: 340px;
      z-index: 10;
    }
    .slider-row { display: flex; align-items: center; gap: 12px; width: 100%; font-size: 13px; font-weight: 600; }
    input[type="range"] { flex: 1; accent-color: #d4af37; cursor: pointer; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    button {
      background: #262a30;
      color: #f0f2f5;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #323840; }
    button.active { background: #c99e28; color: #111; border-color: #e0b94b; font-weight: 600; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="status">Caricamento <code>ETA_6498-1_Movement_parts.glb</code>...</div>
  <div id="viewer"></div>

  <div id="controls">
    <div class="slider-row">
      <span>Vue Éclatée :</span>
      <input id="explodeSlider" type="range" min="0" max="1" step="0.005" value="0" />
      <span id="explodeValue">0%</span>
    </div>
    <div class="btn-row">
      <button id="btnRotate" class="active">Pivoter</button>
      <button id="btnPan">Déplacer</button>
      <button id="btnZoomIn">+ Zoom</button>
      <button id="btnZoomOut">- Zoom</button>
      <button id="btnAuto">Auto</button>
      <button id="btnReset">Centrer</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const CANDIDATE_PATHS = [
      '../ETA_6498-1_Movement_parts.glb',
      '/ETA_6498-1_Movement_parts.glb',
      './ETA_6498-1_Movement_parts.glb'
    ];

    // Escursione ampia lungo l'asse del calibro
    const BASE_EXPLODE_SPREAD = 14.0;

    const statusEl = document.getElementById('status');
    const container = document.getElementById('viewer');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181b20);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 100);
    const DEFAULT_CAM_POS = new THREE.Vector3(2.2, 1.8, 2.5);
    camera.position.copy(DEFAULT_CAM_POS);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.9;
    container.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    // Luci angolate per far brillare i rubini e i biselli dei ponti
    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.6);
    dirLight1.position.set(3, 6, 4);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffe6d5, 1.0);
    dirLight2.position.set(-4, 2, -5);
    scene.add(dirLight2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    let displayGroup = null;
    let modelRoot = null;
    const explodeItems = [];
    const loader = new GLTFLoader();

    function getHierarchyLabel(obj) {
      const parts = [];
      let cur = obj;
      while (cur) {
        if (cur.name) parts.push(cur.name);
        cur = cur.parent;
      }
      return parts.join(' ').toLowerCase();
    }

    function onModelLoaded(gltf) {
      modelRoot = gltf.scene;

      // 1. PRIMA calcoliamo tutto nello spazio locale non ruotato del GLB,
      //    escludendo la tige (401 Winding stem) dalla centratura così il calibro è perfettamente centrato.
      modelRoot.updateMatrixWorld(true);

      const coreBox = new THREE.Box3();
      const fullBox = new THREE.Box3();
      modelRoot.traverse((child) => {
        if (!child.isMesh) return;
        fullBox.expandByObject(child);
        const lbl = getHierarchyLabel(child);
        if (!lbl.includes('401 winding stem')) {
          coreBox.expandByObject(child);
        }
      });

      const refBox = coreBox.isEmpty() ? fullBox : coreBox;
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      refBox.getSize(size);
      refBox.getCenter(center);

      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const normScale = 2.45 / maxDim;

      // Asse reale di impilamento del calibro (quello più sottile del corpo senza tige)
      const minAxis = (size.z <= size.x && size.z <= size.y) ? 'z'
                    : (size.y <= size.x && size.y <= size.z) ? 'y' : 'x';

      // Raccoglie i box di riferimento per gruppi coerenti nello spazio locale
      const barrelBox = new THREE.Box3();
      const windingBox = new THREE.Box3();
      const plateBox = new THREE.Box3();
      const bridgesBox = new THREE.Box3();

      let meshCount = 0;
      modelRoot.traverse((child) => {
        if (!child.isMesh) return;
        meshCount++;
        if (child.material) {
          child.material.side = THREE.DoubleSide;
          child.material.needsUpdate = true;
        }
        const lbl = getHierarchyLabel(child);
        if (lbl.includes('180 movement barrel')) barrelBox.expandByObject(child);
        if (lbl.includes('415 ratchet') || lbl.includes('420 crown') || lbl.includes('422 crown')) {
          windingBox.expandByObject(child);
        }
        if (lbl.includes('100 main plate')) plateBox.expandByObject(child);
        if (lbl.includes('bridge') || lbl.includes('pont')) bridgesBox.expandByObject(child);
      });

      const barrelCenter = new THREE.Vector3();
      if (!barrelBox.isEmpty()) barrelBox.getCenter(barrelCenter);

      const windingCenter = new THREE.Vector3();
      if (!windingBox.isEmpty()) windingBox.getCenter(windingCenter);

      const plateCenter = new THREE.Vector3();
      if (!plateBox.isEmpty()) plateBox.getCenter(plateCenter);

      const bridgesCenter = new THREE.Vector3();
      if (!bridgesBox.isEmpty()) bridgesBox.getCenter(bridgesCenter);

      // Capisce da che lato del centro stanno i ponti rispetto alla platina (+1 o -1)
      const bridgesSign = (bridgesCenter[minAxis] >= plateCenter[minAxis]) ? 1 : -1;
      const plateSign = -bridgesSign;

      // Imposta gli spostamenti puri lungo l'asse del calibro
      modelRoot.traverse((child) => {
        if (!child.isMesh) return;
        const lbl = getHierarchyLabel(child);
        const matName = (child.material && child.material.name) ? child.material.name.toLowerCase() : '';

        const meshBox = new THREE.Box3().setFromObject(child);
        const meshCenter = new THREE.Vector3();
        meshBox.getCenter(meshCenter);

        let localOffset = meshCenter[minAxis] - center[minAxis];
        let mult = 0.45;

        // A. Bariletto tenuto chiuso e compatto
        if (lbl.includes('180 movement barrel')) {
          localOffset = barrelCenter[minAxis] - center[minAxis];
          mult = 0.25;
        }
        // B. Ruote di carica in acciaio (415, 420, 422) allineate insieme sopra il ponte bariletto
        else if (lbl.includes('415 ratchet') || lbl.includes('420 crown') || lbl.includes('422 crown')) {
          localOffset = windingCenter[minAxis] - center[minAxis];
          mult = 1.18;
        }
        // C. Antishock contenuto per ora
        else if (lbl.includes('incabloc')) {
          mult = 0.35;
        }
        // D. Rubini: se stanno sul lato ponti restano FUORI dai ponti; se stanno sul lato platina restano FUORI dalla platina
        else if (matName.includes('rubino') || lbl.includes('ruby')) {
          const onBridgeSide = ((meshCenter[minAxis] - center[minAxis]) * bridgesSign) >= 0;
          if (onBridgeSide) {
            localOffset = bridgesSign * Math.abs(bridgesBox.max[minAxis] - bridgesBox.min[minAxis]) * 0.65;
            mult = 1.25;
          } else {
            localOffset = plateSign * Math.abs(plateBox.max[minAxis] - plateBox.min[minAxis]) * 0.65;
            mult = 1.25;
          }
        }
        // E. Viti: accompagnano il rispettivo lato restando leggermente esterne
        else if (lbl.includes('screw')) {
          const onBridgeSide = ((meshCenter[minAxis] - center[minAxis]) * bridgesSign) >= 0;
          mult = onBridgeSide ? 1.15 : 0.85;
        }
        // F. Treno del tempo e ancora: restano in asse e compatti al centro
        else if (
          lbl.includes('201 centre') ||
          lbl.includes('210 third') ||
          lbl.includes('220 second') ||
          lbl.includes('705 escape') ||
          lbl.includes('710 pallet')
        ) {
          mult = 0.35;
        }
        // G. Platina e ponti: si aprono bene per mostrare tutto l'interno
        else if (lbl.includes('100 main plate') || lbl.includes('bridge') || lbl.includes('pont')) {
          mult = 1.0;
        }

        explodeItems.push({
          obj: child,
          origPos: child.position.clone(),
          axis: minAxis,
          delta: localOffset * BASE_EXPLODE_SPREAD * mult
        });
      });

      // 2. ORA inseriamo modelRoot centrato dentro displayGroup e ruotiamo solo displayGroup!
      //    Così gli assi locali dei singoli pezzi restano allineati al 100% con il calibro.
      modelRoot.scale.setScalar(normScale);
      modelRoot.position.copy(center).multiplyScalar(-normScale);

      displayGroup = new THREE.Group();
      displayGroup.add(modelRoot);

      // Posa orologiera di 3/4:
      // - Tige di carica (che nel GLB punta a +Y) ruotata verso dietro-destra (-Z / +X)
      // - Faccia con i ponti e i rubini rivolta in avanti-alto verso la camera
      displayGroup.rotation.order = 'YXZ';
      displayGroup.rotation.y = -0.65;
      displayGroup.rotation.x = -0.78;
      displayGroup.rotation.z = 2.15;

      scene.add(displayGroup);

      statusEl.innerHTML = `<strong>Modello caricato</strong> (${meshCount} parti | Asse locale: ${minAxis.toUpperCase()})`;
    }

    function tryLoadFromIndex(index) {
      if (index >= CANDIDATE_PATHS.length) {
        statusEl.innerHTML = `<span style="color:#ff6b6b;">File <code>ETA_6498-1_Movement_parts.glb</code> non trovato.</span>`;
        return;
      }
      loader.load(
        CANDIDATE_PATHS[index],
        (gltf) => onModelLoaded(gltf),
        (xhr) => {
          if (xhr.total) {
            statusEl.innerHTML = `Caricamento: <strong>${Math.round((xhr.loaded / xhr.total) * 100)}%</strong>`;
          }
        },
        () => tryLoadFromIndex(index + 1)
      );
    }

    tryLoadFromIndex(0);

    const slider = document.getElementById('explodeSlider');
    const sliderVal = document.getElementById('explodeValue');
    slider.addEventListener('input', () => {
      const t = parseFloat(slider.value);
      sliderVal.textContent = `${Math.round(t * 100)}%`;
      for (const item of explodeItems) {
        item.obj.position.copy(item.origPos);
        item.obj.position[item.axis] += item.delta * t;
      }
    });

    const btnRotate = document.getElementById('btnRotate');
    const btnPan = document.getElementById('btnPan');
    const btnAuto = document.getElementById('btnAuto');

    btnRotate.onclick = () => {
      controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
      btnRotate.classList.add('active');
      btnPan.classList.remove('active');
    };
    btnPan.onclick = () => {
      controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
      btnPan.classList.add('active');
      btnRotate.classList.remove('active');
    };
    document.getElementById('btnZoomIn').onclick = () => camera.position.multiplyScalar(0.85);
    document.getElementById('btnZoomOut').onclick = () => camera.position.multiplyScalar(1.18);
    btnAuto.onclick = () => {
      controls.autoRotate = !controls.autoRotate;
      btnAuto.classList.toggle('active', controls.autoRotate);
    };
    document.getElementById('btnReset').onclick = () => {
      camera.position.copy(DEFAULT_CAM_POS);
      controls.target.set(0, 0, 0);
      controls.update();
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test 3D - ETA 6498-1 (Vue Éclatée Méthode Ciechanowski)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #141619;
      color: #f0f2f5;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #viewer { width: 100%; height: 100%; display: block; }
    #status {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(20, 22, 25, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.4;
      z-index: 10;
    }
    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 22, 25, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 18px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      min-width: 360px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      z-index: 10;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      font-size: 13px;
      font-weight: 600;
    }
    input[type="range"] {
      flex: 1;
      accent-color: #d4af37;
      cursor: pointer;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: #262a30;
      color: #f0f2f5;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #323840; }
    button.active {
      background: #c99e28;
      color: #111;
      border-color: #e0b94b;
      font-weight: 600;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="status">Caricamento <code>ETA_6498-1_Movement_parts.glb</code>...</div>
  <div id="viewer"></div>

  <div id="controls">
    <div class="slider-row">
      <span>Vue Éclatée :</span>
      <input id="explodeSlider" type="range" min="0" max="1" step="0.005" value="0" />
      <span id="explodeValue">0%</span>
    </div>
    <div class="btn-row">
      <button id="btnRotate" class="active">Pivoter</button>
      <button id="btnPan">Déplacer</button>
      <button id="btnZoomIn">+ Zoom</button>
      <button id="btnZoomOut">- Zoom</button>
      <button id="btnAuto">Auto</button>
      <button id="btnReset">Centrer</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const CANDIDATE_PATHS = [
      '../ETA_6498-1_Movement_parts.glb',
      '/ETA_6498-1_Movement_parts.glb',
      './ETA_6498-1_Movement_parts.glb'
    ];

    // Escursione a fette parallele lungo l'asse dei perni (in unità normalizzate)
    const SLICE_AMPLITUDE = 1.35;

    const statusEl = document.getElementById('status');
    const container = document.getElementById('viewer');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181b20);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.01, 100);
    const BASE_CAM_DIST = 3.9;
    const CAM_DIR = new THREE.Vector3(2.4, 1.85, 2.65).normalize();
    camera.position.copy(CAM_DIR).multiplyScalar(BASE_CAM_DIST);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.9;
    container.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.6);
    dirLight1.position.set(3, 6, 4);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffe6d5, 1.0);
    dirLight2.position.set(-4, 2, -5);
    scene.add(dirLight2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    let displayGroup = null;
    let modelRoot = null;
    let userZoomScale = 1.0;
    const explodeItems = [];
    const loader = new GLTFLoader();

    function getHierarchyLabel(obj) {
      const parts = [];
      let cur = obj;
      while (cur) {
        if (cur.name) parts.push(cur.name);
        cur = cur.parent;
      }
      return parts.join(' ').toLowerCase();
    }

    function getMaterialNames(child) {
      const names = [];
      if (!child.material) return '';
      if (Array.isArray(child.material)) {
        for (const m of child.material) if (m && m.name) names.push(m.name.toLowerCase());
      } else if (child.material.name) {
        names.push(child.material.name.toLowerCase());
      }
      return names.join(' ');
    }

    function onModelLoaded(gltf) {
      modelRoot = gltf.scene;
      modelRoot.updateMatrixWorld(true);

      const coreBox = new THREE.Box3();
      const fullBox = new THREE.Box3();
      const plateBox = new THREE.Box3();
      const bridgesBox = new THREE.Box3();

      let meshCount = 0;
      modelRoot.traverse((child) => {
        if (!child.isMesh) return;
        meshCount++;
        if (child.material) {
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          for (const m of mats) {
            if (m) {
              m.side = THREE.DoubleSide;
              m.needsUpdate = true;
            }
          }
        }
        fullBox.expandByObject(child);
        const lbl = getHierarchyLabel(child);
        if (!lbl.includes('401 winding stem')) {
          coreBox.expandByObject(child);
        }
        if (lbl.includes('100 main plate')) plateBox.expandByObject(child);
        else if (lbl.includes('bridge') || lbl.includes('pont')) bridgesBox.expandByObject(child);
      });

      const refBox = coreBox.isEmpty() ? fullBox : coreBox;
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      refBox.getSize(size);
      refBox.getCenter(center);

      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const normScale = 2.45 / maxDim;

      // Asse perpendicolare alla platina (dove lo spessore è minimo: asse dei perni)
      const stackAxis = (size.x <= size.y && size.x <= size.z) ? 'x'
                      : (size.y <= size.x && size.y <= size.z) ? 'y' : 'z';

      const plateCenter = new THREE.Vector3();
      if (!plateBox.isEmpty()) plateBox.getCenter(plateCenter);

      const bridgesCenter = new THREE.Vector3();
      if (!bridgesBox.isEmpty()) bridgesBox.getCenter(bridgesCenter);

      // Verso dei ponti (+1 o -1) e verso della platina/quadrante (-1 o +1)
      const bridgeDir = (bridgesCenter[stackAxis] >= plateCenter[stackAxis]) ? 1 : -1;
      const dialDir = -bridgeDir;

      const axisVecModel = new THREE.Vector3(
        stackAxis === 'x' ? 1 : 0,
        stackAxis === 'y' ? 1 : 0,
        stackAxis === 'z' ? 1 : 0
      );

      // Mappa rigorosa basata sulla sequenza di assemblaggio ETA 6498-1:
      // Negativo = verso lato quadrante (dialDir) | Positivo = verso lato ponti (bridgeDir)
      function getEtaSliceLevel(lbl, matNames, meshCenter) {
        const isRuby = matNames.includes('rubino') || lbl.includes('ruby');
        const onBridgeSide = ((meshCenter[stackAxis] - center[stackAxis]) * bridgeDir) >= 0;

        // 0. Rubini: restano ancorati/solidali al rispettivo supporto (nessun effetto proiettile)
        if (isRuby) {
          if (lbl.includes('incabloc')) return bridgeDir * 0.22;
          if (lbl.includes('121 balancing') || lbl.includes('303')) return bridgeDir * 0.78;
          if (lbl.includes('110 train')) return bridgeDir * 0.48;
          if (lbl.includes('125 pallet')) return bridgeDir * 0.34;
          return onBridgeSide ? (bridgeDir * 0.48) : (dialDir * 0.38);
        }

        // --- LATO QUADRANTE (Montage du mécanisme de mise à l'heure) ---
        // Fetta -5: Ruota ore (250) e Chaussée (240)
        if (lbl.includes('250 hour')) return dialDir * 0.88;
        if (lbl.includes('240 driver')) return dialDir * 0.80;

        // Fetta -4: Ruota minuteria (260), rinvii (450/453), tiretto e sautoir (443/445 + viti 5443/5445)
        if (
          lbl.includes('260 minute') ||
          lbl.includes('450 setting') ||
          lbl.includes('453 intermediate') ||
          lbl.includes('443m setting') ||
          lbl.includes('445m setting') ||
          lbl.includes('5443') ||
          lbl.includes('5445')
        ) {
          return dialDir * 0.68;
        }

        // Fetta -3: Tige (401), pignone scorrevole (407), pignone carica (410), bascula e molla (435/440)
        if (
          lbl.includes('401 winding stem') ||
          lbl.includes('407 winding') ||
          lbl.includes('410 sliding') ||
          lbl.includes('435 yoke') ||
          lbl.includes('440 yoke')
        ) {
          return dialDir * 0.54;
        }

        // --- BASE STRUTTURALE ---
        // Fetta -2: Platina principale (100 Main Plate)
        if (lbl.includes('100 main plate')) {
          return dialDir * 0.38;
        }

        // --- LATO MOVIMENTO DI BASE (Montage du mouvement de base) ---
        // Fetta -1: Bariletto completo (180) tenuto chiuso e compatto
        if (lbl.includes('180 movement barrel')) {
          return dialDir * 0.16;
        }

        // Fetta 0 (Centro): Treno del tempo (201 Centro, 210 Terza, 220/224 Secondi)
        if (
          lbl.includes('201 centre') ||
          lbl.includes('210 third') ||
          lbl.includes('220 second')
        ) {
          return 0.0;
        }

        // Fetta +1: Scappamento e Bilanciere (705 Ruota scappamento, 710 Ancora, 721 Bilanciere)
        if (lbl.includes('705 escape')) return bridgeDir * 0.10;
        if (lbl.includes('710 pallet')) return bridgeDir * 0.14;
        if (lbl.includes('721 balance')) return bridgeDir * 0.18;

        // Antishock (Incabloc) contenuto vicino al bilanciere/platina
        if (lbl.includes('incabloc')) {
          return onBridgeSide ? (bridgeDir * 0.22) : (dialDir * 0.42);
        }

        // Fetta +2: Ponte d'ancora (125) + viti 5125
        if (lbl.includes('125 pallet bridge') || lbl.includes('5125')) {
          return bridgeDir * 0.34;
        }

        // Fetta +3: Ponte ruotismo (110 + viti 5110) e Ponte bariletto (105M + viti 5105) + cricco (425/430)
        if (
          lbl.includes('110 train wheel bridge') ||
          lbl.includes('5110') ||
          lbl.includes('105m barrel bridge') ||
          lbl.includes('5105') ||
          lbl.includes('425 click') ||
          lbl.includes('430 click')
        ) {
          return bridgeDir * 0.48;
        }

        // Fetta +4: Ruote di carica sopra il ponte bariletto (415 Rocchetto, 420 Corona, 422 Anello)
        if (
          lbl.includes('415 ratchet') ||
          lbl.includes('420 crown') ||
          lbl.includes('422 crown')
        ) {
          return bridgeDir * 0.64;
        }

        // Fetta +5: Ponte bilanciere (121 + racchetta 303 + porte-piton 375) e viti superiori
        if (
          lbl.includes('121 balancing bridge') ||
          lbl.includes('303 two') ||
          lbl.includes('375 stud') ||
          lbl.includes('5121') ||
          lbl.includes('5415') ||
          lbl.includes('5420') ||
          lbl.includes('5425')
        ) {
          return bridgeDir * 0.78;
        }

        // Fallback eventuale per viti o minuterie non esplicitate
        if (lbl.includes('screw')) {
          return onBridgeSide ? (bridgeDir * 0.56) : (dialDir * 0.68);
        }
        return 0.0;
      }

      modelRoot.traverse((child) => {
        if (!child.isMesh) return;
        const lbl = getHierarchyLabel(child);
        const matNames = getMaterialNames(child);

        const meshBox = new THREE.Box3().setFromObject(child);
        const meshCenter = new THREE.Vector3();
        meshBox.getCenter(meshCenter);

        const level = getEtaSliceLevel(lbl, matNames, meshCenter);
        const totalWorldDelta = level * SLICE_AMPLITUDE;

        // Converte lo spostamento perpendicolare alla platina nello spazio locale di child.parent
        const worldDir = axisVecModel.clone().transformDirection(modelRoot.matrixWorld).normalize();
        const parentInvWorld = child.parent
          ? child.parent.matrixWorld.clone().invert()
          : new THREE.Matrix4().identity();
        const localDir = worldDir.clone().transformDirection(parentInvWorld).normalize();

        const parentScale = new THREE.Vector3(1, 1, 1);
        if (child.parent) child.parent.getWorldScale(parentScale);

        const deltaVec = new THREE.Vector3(
          localDir.x * totalWorldDelta / (normScale * (parentScale.x || 1)),
          localDir.y * totalWorldDelta / (normScale * (parentScale.y || 1)),
          localDir.z * totalWorldDelta / (normScale * (parentScale.z || 1))
        );

        explodeItems.push({
          obj: child,
          origPos: child.position.clone(),
          deltaVec
        });
      });

      modelRoot.scale.setScalar(normScale);
      modelRoot.position.copy(center).multiplyScalar(-normScale);

      displayGroup = new THREE.Group();
      displayGroup.add(modelRoot);

      // Posa 3/4 con tige verso il retro-sinistra e lato ponti/rubini in primo piano
      displayGroup.rotation.order = 'YXZ';
      displayGroup.rotation.y = -0.65;
      displayGroup.rotation.x = -0.78;
      displayGroup.rotation.z = 2.15;

      scene.add(displayGroup);

      statusEl.innerHTML =
        `<strong>Modello caricato</strong> (${meshCount} parti | Asse perni: ${stackAxis.toUpperCase()})<br>` +
        `Sequenza ETA 6498-1 a fette parallele`;
    }

    function tryLoadFromIndex(index) {
      if (index >= CANDIDATE_PATHS.length) {
        statusEl.innerHTML = `<span style="color:#ff6b6b;">File <code>ETA_6498-1_Movement_parts.glb</code> non trovato.</span>`;
        return;
      }
      loader.load(
        CANDIDATE_PATHS[index],
        (gltf) => onModelLoaded(gltf),
        (xhr) => {
          if (xhr.total) {
            const pct = Math.round((xhr.loaded / xhr.total) * 100);
            statusEl.innerHTML = `Caricamento: <strong>${pct}%</strong>`;
          }
        },
        () => tryLoadFromIndex(index + 1)
      );
    }

    tryLoadFromIndex(0);

    function updateCameraDistance(t) {
      // Micro-zoom adattivo stile Ciechanowski: arretra dolcemente al crescere dell'esploso
      const targetDist = BASE_CAM_DIST * (1 + 0.38 * t) * userZoomScale;
      const dir = camera.position.clone().sub(controls.target).normalize();
      if (dir.lengthSq() < 0.0001) dir.copy(CAM_DIR);
      camera.position.copy(controls.target).addScaledVector(dir, targetDist);
    }

    const slider = document.getElementById('explodeSlider');
    const sliderVal = document.getElementById('explodeValue');
    slider.addEventListener('input', () => {
      const rawT = parseFloat(slider.value);
      sliderVal.textContent = `${Math.round(rawT * 100)}%`;
      // Curva fluida: partenza progressiva nei primi gradi, apertura completa al 100%
      const easedT = rawT * rawT * (3 - 2 * rawT);
      for (const item of explodeItems) {
        item.obj.position.copy(item.origPos).addScaledVector(item.deltaVec, easedT);
      }
      updateCameraDistance(easedT);
    });

    const btnRotate = document.getElementById('btnRotate');
    const btnPan = document.getElementById('btnPan');
    const btnAuto = document.getElementById('btnAuto');

    btnRotate.onclick = () => {
      controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
      btnRotate.classList.add('active');
      btnPan.classList.remove('active');
    };
    btnPan.onclick = () => {
      controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
      btnPan.classList.add('active');
      btnRotate.classList.remove('active');
    };
    document.getElementById('btnZoomIn').onclick = () => {
      userZoomScale = Math.max(0.45, userZoomScale * 0.85);
      const rawT = parseFloat(slider.value);
      updateCameraDistance(rawT * rawT * (3 - 2 * rawT));
    };
    document.getElementById('btnZoomOut').onclick = () => {
      userZoomScale = Math.min(2.2, userZoomScale * 1.18);
      const rawT = parseFloat(slider.value);
      updateCameraDistance(rawT * rawT * (3 - 2 * rawT));
    };
    btnAuto.onclick = () => {
      controls.autoRotate = !controls.autoRotate;
      btnAuto.classList.toggle('active', controls.autoRotate);
    };
    document.getElementById('btnReset').onclick = () => {
      userZoomScale = 1.0;
      controls.target.set(0, 0, 0);
      const rawT = parseFloat(slider.value);
      const easedT = rawT * rawT * (3 - 2 * rawT);
      camera.position.copy(CAM_DIR).multiplyScalar(BASE_CAM_DIST * (1 + 0.38 * easedT));
      controls.update();
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

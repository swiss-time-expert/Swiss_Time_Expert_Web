<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETA 6498-1 — Vue Éclatée 3D | Swiss Time Expert</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #1e2229 0%, #0d0f12 100%);
      color: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Header & Info */
    .hud-top {
      position: absolute;
      top: 20px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      pointer-events: none;
    }
    .title-box {
      background: rgba(18, 20, 26, 0.78);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 20px;
      border-radius: 12px;
      pointer-events: auto;
    }
    .title-box h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #e2c07d;
    }
    .title-box p {
      font-size: 0.8rem;
      color: #9aa3b2;
      margin-top: 4px;
    }

    .mode-box {
      background: rgba(18, 20, 26, 0.78);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 14px;
      border-radius: 12px;
      pointer-events: auto;
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 0.8rem;
    }
    .mode-box select, .mode-box button {
      background: #252a34;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .mode-box button:hover {
      background: #323846;
    }

    /* Scheda componente selezionato */
    #selected-card {
      position: absolute;
      bottom: 124px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 20, 26, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 192, 125, 0.45);
      padding: 10px 18px;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      gap: 14px;
      max-width: min(640px, 92vw);
      z-index: 10;
    }
    #selected-card.visible {
      display: flex;
    }
    .selected-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .selected-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9aa3b2;
    }
    #selected-part-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e2c07d;
      word-break: break-word;
    }
    #clear-selection {
      background: rgba(255, 255, 255, 0.08);
      color: #e6e9ef;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.75rem;
      flex-shrink: 0;
    }
    #clear-selection:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    /* Slider Esploso in basso */
    .controls-bottom {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: min(540px, 90vw);
      background: rgba(18, 20, 26, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 192, 125, 0.3);
      padding: 16px 24px;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.03em;
    }
    .slider-header span.value {
      color: #e2c07d;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: #2c323d;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e2c07d;
      border: 2px solid #12141a;
      box-shadow: 0 0 10px rgba(226, 192, 125, 0.6);
      cursor: grab;
    }
    input[type="range"]::-webkit-slider-thumb:active {
      cursor: grabbing;
      transform: scale(1.1);
    }

    /* Loader */
    #loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0d0f12;
      z-index: 20;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(226, 192, 125, 0.2);
      border-top-color: #e2c07d;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Import Map per Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div id="loader-text">Chargement du calibre ETA 6498-1...</div>
  </div>

  <div class="hud-top">
    <div class="title-box">
      <h1>CALIBRE ETA 6498-1</h1>
      <p>Clic gauche : pivoter • Clic sur pièce : nom • Molette : zoom • Clic droit : déplacer</p>
    </div>

    <div class="mode-box">
      <label for="explode-axis">Axe :</label>
      <select id="explode-axis">
        <option value="vertical-y" selected>Vertical (Axe Y)</option>
        <option value="vertical-z">Vertical (Axe Z)</option>
        <option value="radial">Radial 3D</option>
      </select>
      <button id="reset-cam">Centrer</button>
    </div>
  </div>

  <div id="selected-card" aria-live="polite">
    <div class="selected-meta">
      <span class="selected-label">Pièce sélectionnée</span>
      <span id="selected-part-name">—</span>
    </div>
    <button id="clear-selection" type="button">Désélectionner</button>
  </div>

  <div class="controls-bottom">
    <div class="slider-header">
      <span>VUE ÉCLATÉE (EXPLOSÉ)</span>
      <span class="value" id="explode-val">0%</span>
    </div>
    <input type="range" id="explode-slider" min="0" max="100" value="0" step="0.5" />
  </div>

  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // File GLB nella cartella principale (un livello sopra la cartella "fr")
    const MODEL_URL = '../ETA6498-1%20Web.glb';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(0, 3.4, 4.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // Illuminazione da studio orologiero
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.9);
    dirLight1.position.set(5, 10, 7);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xdbe8ff, 0.9);
    dirLight2.position.set(-6, -4, -5);
    scene.add(dirLight2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    let modelGroup = null;
    const explodeItems = [];
    const pickableMeshes = [];
    let initialCamPos = new THREE.Vector3();

    // Stato selezione pezzo
    let selectedMesh = null;
    let selectedOriginalEmissive = null;
    let selectedOriginalEmissiveIntensity = 0;

    const selectedCard = document.getElementById('selected-card');
    const selectedPartNameEl = document.getElementById('selected-part-name');
    const clearSelectionBtn = document.getElementById('clear-selection');

    function formatPartName(rawName) {
      if (!rawName) return 'Composant sans nom';
      return rawName
        .replace(/\.(sldprt|sldasm|igs|iges|step|stp|glb|gltf|blend)$/i, '')
        .replace(/[_-]+/g, ' ')
        .replace(/\s*\.\d+$/, '')
        .trim() || 'Composant sans nom';
    }

    function resolveComponentName(mesh) {
      // Risale la gerarchia per trovare un nome descrittivo se la mesh ha un nome generico
      let current = mesh;
      const genericPattern = /^(mesh|object|node|part|solid|group|body|untitled)(_|\s|-|\d|\.)*$/i;

      while (current && current !== modelGroup) {
        if (current.name && !genericPattern.test(current.name.trim())) {
          return formatPartName(current.name);
        }
        current = current.parent;
      }
      return formatPartName(mesh.name || mesh.parent?.name || '');
    }

    function clearSelectedPart() {
      if (selectedMesh && selectedMesh.material && 'emissive' in selectedMesh.material) {
        selectedMesh.material.emissive.copy(selectedOriginalEmissive);
        selectedMesh.material.emissiveIntensity = selectedOriginalEmissiveIntensity;
      }
      selectedMesh = null;
      selectedOriginalEmissive = null;
      selectedPartNameEl.textContent = '—';
      selectedCard.classList.remove('visible');
    }

    function selectPart(mesh) {
      if (selectedMesh === mesh) return;
      clearSelectedPart();

      selectedMesh = mesh;
      const displayName = resolveComponentName(mesh);
      selectedPartNameEl.textContent = displayName;
      selectedCard.classList.add('visible');

      // Evidenzia delicatamente il pezzo selezionato
      if (mesh.material && 'emissive' in mesh.material) {
        // Clona il materiale solo per la mesh selezionata così non altera altri pezzi condivisi
        mesh.material = mesh.material.clone();
        selectedOriginalEmissive = mesh.material.emissive.clone();
        selectedOriginalEmissiveIntensity = mesh.material.emissiveIntensity ?? 1;
        mesh.material.emissive.setHex(0x8c6928);
        mesh.material.emissiveIntensity = 0.65;
      }
    }

    clearSelectionBtn.addEventListener('click', clearSelectedPart);

    const loader = new GLTFLoader();
    loader.load(
      MODEL_URL,
      (gltf) => {
        modelGroup = gltf.scene;

        const box = new THREE.Box3().setFromObject(modelGroup);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);

        const scaleFactor = 3.0 / maxDim;
        modelGroup.scale.setScalar(scaleFactor);

        box.setFromObject(modelGroup);
        box.getCenter(center);
        modelGroup.position.sub(center);

        scene.add(modelGroup);
        modelGroup.updateMatrixWorld(true);

        const globalCenter = new THREE.Vector3(0, 0, 0);

        modelGroup.traverse((child) => {
          if (child.isMesh) {
            if (child.material) {
              child.material.needsUpdate = true;
            }

            pickableMeshes.push(child);

            const meshBox = new THREE.Box3().setFromObject(child);
            const meshCenterWorld = meshBox.getCenter(new THREE.Vector3());
            const dirFromCenter = meshCenterWorld.clone().sub(globalCenter);

            explodeItems.push({
              mesh: child,
              origPos: child.position.clone(),
              worldOffset: dirFromCenter,
              parent: child.parent
            });
          }
        });

        camera.position.set(0, 3.1, 4.4);
        initialCamPos.copy(camera.position);
        controls.target.set(0, 0, 0);
        controls.update();

        const loaderEl = document.getElementById('loader');
        loaderEl.style.opacity = '0';
        setTimeout(() => loaderEl.remove(), 400);
      },
      (xhr) => {
        if (xhr.total > 0) {
          const pct = Math.round((xhr.loaded / xhr.total) * 100);
          document.getElementById('loader-text').textContent = `Chargement : ${pct}%`;
        }
      },
      (error) => {
        console.error('Erreur de chargement GLB:', error);
        document.getElementById('loader-text').innerHTML =
          'Erreur : fichier introuvable.<br><small>Vérifiez que "ETA6498-1 Web.glb" est bien à la racine du dépôt.</small>';
      }
    );

    // Raycasting per clic/selezione singolo componente (distinguendo il clic dal trascinamento)
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDownPos = { x: 0, y: 0 };

    renderer.domElement.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      pointerDownPos = { x: event.clientX, y: event.clientY };
    });

    renderer.domElement.addEventListener('pointerup', (event) => {
      if (event.button !== 0) return;
      const moveDist = Math.hypot(
        event.clientX - pointerDownPos.x,
        event.clientY - pointerDownPos.y
      );
      // Ignora se l'utente stava ruotando la camera
      if (moveDist > 5 || pickableMeshes.length === 0) return;

      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(pickableMeshes, false);

      if (hits.length > 0) {
        selectPart(hits[0].object);
      }
    });

    // Logica Slider Esploso (escursione ampliata per maggiore respiro visivo)
    const slider = document.getElementById('explode-slider');
    const valDisplay = document.getElementById('explode-val');
    const axisSelect = document.getElementById('explode-axis');

    function updateExplode() {
      const factor = parseFloat(slider.value) / 100;
      valDisplay.textContent = `${Math.round(factor * 100)}%`;
      const mode = axisSelect.value;

      explodeItems.forEach((item) => {
        if (factor === 0) {
          item.mesh.position.copy(item.origPos);
          return;
        }

        const shiftWorld = new THREE.Vector3();
        const spread = factor * 3.4;

        if (mode === 'vertical-y') {
          shiftWorld.set(
            item.worldOffset.x * spread * 0.28,
            item.worldOffset.y * spread * 2.5,
            item.worldOffset.z * spread * 0.28
          );
        } else if (mode === 'vertical-z') {
          shiftWorld.set(
            item.worldOffset.x * spread * 0.28,
            item.worldOffset.y * spread * 0.28,
            item.worldOffset.z * spread * 2.5
          );
        } else {
          shiftWorld.copy(item.worldOffset).multiplyScalar(spread * 1.85);
        }

        if (item.parent) {
          const parentScale = new THREE.Vector3();
          item.parent.getWorldScale(parentScale);
          const localShift = shiftWorld.clone();
          localShift.x /= parentScale.x || 1;
          localShift.y /= parentScale.y || 1;
          localShift.z /= parentScale.z || 1;

          const parentQuat = new THREE.Quaternion();
          item.parent.getWorldQuaternion(parentQuat);
          localShift.applyQuaternion(parentQuat.invert());

          item.mesh.position.copy(item.origPos).add(localShift);
        }
      });
    }

    slider.addEventListener('input', updateExplode);
    axisSelect.addEventListener('change', updateExplode);

    document.getElementById('reset-cam').addEventListener('click', () => {
      camera.position.copy(initialCamPos);
      controls.target.set(0, 0, 0);
      controls.update();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

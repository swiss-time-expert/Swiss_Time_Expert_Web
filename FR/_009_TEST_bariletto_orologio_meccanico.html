<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test 3D - ETA 6498-1 (Vue Éclatée "Panino")</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #141619;
      color: #f0f2f5;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #viewer { width: 100%; height: 100%; display: block; }
    #status {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(20, 22, 25, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.4;
      z-index: 10;
    }
    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 22, 25, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 18px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      min-width: 360px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      z-index: 10;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      font-size: 13px;
      font-weight: 600;
    }
    input[type="range"] {
      flex: 1;
      accent-color: #d4af37;
      cursor: pointer;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: #262a30;
      color: #f0f2f5;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #323840; }
    button.active {
      background: #c99e28;
      color: #111;
      border-color: #e0b94b;
      font-weight: 600;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="status">Caricamento <code>ETA_6498-1_Movement_parts.glb</code>...</div>
  <div id="viewer"></div>

  <div id="controls">
    <div class="slider-row">
      <span>Vue Éclatée :</span>
      <input id="explodeSlider" type="range" min="0" max="1" step="0.005" value="0" />
      <span id="explodeValue">0%</span>
    </div>
    <div class="btn-row">
      <button id="btnRotate" class="active">Pivoter</button>
      <button id="btnPan">Déplacer</button>
      <button id="btnZoomIn">+ Zoom</button>
      <button id="btnZoomOut">- Zoom</button>
      <button id="btnAuto">Auto</button>
      <button id="btnReset">Centrer</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const CANDIDATE_PATHS = [
      '../ETA_6498-1_Movement_parts.glb',
      '/ETA_6498-1_Movement_parts.glb',
      './ETA_6498-1_Movement_parts.glb'
    ];

    const HORIZONTAL_SPREAD = 1.65;

    // Angolazione iniziale di riferimento
    const BASE_ROT = { x: -0.35, y: -0.55, z: 1.55 };
    // Rotazione d'accompagnamento verso il lato opposto durante l'esploso
    const EXPLODE_ROT_DELTA = { x: -0.08, y: -0.45, z: 0.14 };

    const statusEl = document.getElementById('status');
    const container = document.getElementById('viewer');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181b20);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.01, 100);
    const BASE_CAM_DIST = 4.6;
    const CAM_DIR = new THREE.Vector3(0.0, 0.25, 1.0).normalize();
    camera.position.copy(CAM_DIR).multiplyScalar(BASE_CAM_DIST);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.9;
    container.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.6);
    dirLight1.position.set(3, 5, 6);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffe6d5, 1.0);
    dirLight2.position.set(-4, -2, 5);
    scene.add(dirLight2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.035;
    controls.rotateSpeed = 0.75;
    controls.zoomSpeed = 0.9;
    controls.panSpeed = 0.8;
    controls.target.set(0, 0, 0);

    let displayGroup = null;
    let modelRoot = null;
    let userZoomScale = 1.0;
    const explodeItems = [];
    const loader = new GLTFLoader();

    function getHierarchyLabel(obj) {
      const parts = [];
      let cur = obj;
      while (cur) {
        if (cur.name) parts.push(cur.name);
        cur = cur.parent;
      }
      return parts.join(' ').toLowerCase();
    }

    function getMaterialNames(child) {
      const names = [];
      if (!child.material) return '';
      if (Array.isArray(child.material)) {
        for (const m of child.material) if (m && m.name) names.push(m.name.toLowerCase());
      } else if (child.material.name) {
        names.push(child.material.name.toLowerCase());
      }
      return names.join(' ');
    }

    function getHorizontalStep(lbl, matNames) {
      if (lbl.includes('100 main plate') || lbl.includes('main_plate') || lbl.includes('platine')) {
        return -0.78;
      }

      if (lbl.includes('180 movement barrel') || lbl.includes('barrel')) {
        if (lbl.includes('105m barrel bridge') || lbl.includes('barrel bridge')) {
          return 0.42;
        }
        return -0.22;
      }

      if (
        lbl.includes('250 hour') ||
        lbl.includes('240 driver') ||
        lbl.includes('260 minute') ||
        lbl.includes('401 winding stem') ||
        lbl.includes('407 winding') ||
        lbl.includes('410 sliding') ||
        lbl.includes('435 yoke') ||
        lbl.includes('440 yoke') ||
        lbl.includes('443m setting') ||
        lbl.includes('445m setting') ||
        lbl.includes('450 setting') ||
        lbl.includes('453 intermediate')
      ) {
        return -0.45;
      }

      if (
        lbl.includes('201 centre') ||
        lbl.includes('210 third') ||
        lbl.includes('220 second')
      ) {
        return 0.02;
      }

      if (
        lbl.includes('705 escape') ||
        lbl.includes('710 pallet') ||
        lbl.includes('721 balance') ||
        lbl.includes('730 double') ||
        lbl.includes('incabloc')
      ) {
        return 0.18;
      }

      if (lbl.includes('125 pallet bridge')) return 0.34;
      if (lbl.includes('110 train wheel bridge')) return 0.48;
      if (lbl.includes('121 balancing bridge') || lbl.includes('303 two') || lbl.includes('375 stud')) {
        return 0.64;
      }
      if (lbl.includes('bridge') || lbl.includes('pont')) return 0.46;

      if (
        lbl.includes('415 ratchet') ||
        lbl.includes('420 crown') ||
        lbl.includes('422 crown') ||
        lbl.includes('425 click') ||
        lbl.includes('430 click')
      ) {
        return 0.56;
      }

      const isRuby = matNames.includes('rubino') || lbl.includes('ruby');
      if (isRuby || lbl.includes('screw')) {
        return 0.30;
      }

      return 0.08;
    }

    function onModelLoaded(gltf) {
      modelRoot = gltf.scene;
      modelRoot.updateMatrixWorld(true);

      const coreBox = new THREE.Box3();
      const fullBox = new THREE.Box3();
      const palletBox = new THREE.Box3();
      const rollerBalanceBox = new THREE.Box3();
      let meshCount = 0;

      modelRoot.traverse((child) => {
        if (!child.isMesh) return;
        meshCount++;
        fullBox.expandByObject(child);
        const lbl = getHierarchyLabel(child);
        if (!lbl.includes('401 winding stem')) {
          coreBox.expandByObject(child);
        }
        if (lbl.includes('710 pallet') || lbl.includes('pallet')) {
          palletBox.expandByObject(child);
        }
        if (lbl.includes('730 double') || lbl.includes('roller') || lbl.includes('721 balance')) {
          rollerBalanceBox.expandByObject(child);
        }
        if (child.material) {
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          for (const m of mats) {
            if (m) {
              m.side = THREE.DoubleSide;
              m.needsUpdate = true;
            }
          }
        }
      });

      const refBox = coreBox.isEmpty() ? fullBox : coreBox;
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      refBox.getSize(size);
      refBox.getCenter(center);

      const palletCenter = new THREE.Vector3();
      const hasPalletBox = !palletBox.isEmpty();
      if (hasPalletBox) palletBox.getCenter(palletCenter);

      const rollerBalanceCenter = new THREE.Vector3();
      const hasRollerBalanceBox = !rollerBalanceBox.isEmpty();
      if (hasRollerBalanceBox) rollerBalanceBox.getCenter(rollerBalanceCenter);

      const stackAxis = (size.x <= size.y && size.x <= size.z) ? 'x'
                      : (size.y <= size.x && size.y <= size.z) ? 'y' : 'z';
      const localStackVec = new THREE.Vector3(
        stackAxis === 'x' ? 1 : 0,
        stackAxis === 'y' ? 1 : 0,
        stackAxis === 'z' ? 1 : 0
      );

      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const normScale = 2.35 / maxDim;

      modelRoot.scale.setScalar(normScale);
      modelRoot.position.copy(center).multiplyScalar(-normScale);

      displayGroup = new THREE.Group();
      displayGroup.add(modelRoot);
      displayGroup.rotation.order = 'YXZ';
      displayGroup.rotation.set(BASE_ROT.x, BASE_ROT.y, BASE_ROT.z);

      scene.add(displayGroup);
      scene.updateMatrixWorld(true);

      const worldSandwichAxis = localStackVec
        .clone()
        .transformDirection(modelRoot.matrixWorld)
        .normalize();

      const worldOrigin = new THREE.Vector3(0, 0, 0);

      // Soglia di prossimità (in unità locali non scalate) per agganciare i piccoli rubini dell'ancora e del plateau
      const proximityRadius = maxDim * 0.14;

      modelRoot.traverse((child) => {
        if (!child.isMesh) return;
        const lbl = getHierarchyLabel(child);
        const matNames = getMaterialNames(child);
        const isRuby = matNames.includes('rubino') || lbl.includes('ruby');

        const childBox = new THREE.Box3().setFromObject(child);
        const childCenter = new THREE.Vector3();
        childBox.getCenter(childCenter);

        let step = getHorizontalStep(lbl, matNames);

        // Se è un rubino (o un piccolo componente vicino all'ancora o al plateau/bilanciere),
        // segue esattamente il gruppo 0.18 dell'ancora/plateau/bilanciere senza staccarsi
        if (isRuby) {
          const nearPallet = hasPalletBox && childCenter.distanceTo(palletCenter) <= proximityRadius;
          const nearRollerBalance = hasRollerBalanceBox && childCenter.distanceTo(rollerBalanceCenter) <= proximityRadius;
          if (
            nearPallet ||
            nearRollerBalance ||
            lbl.includes('710') ||
            lbl.includes('pallet') ||
            lbl.includes('730') ||
            lbl.includes('roller') ||
            lbl.includes('721') ||
            lbl.includes('balance')
          ) {
            step = 0.18;
          }
        }

        const sandwichShift = step * HORIZONTAL_SPREAD;

        const targetWorld = worldSandwichAxis.clone().multiplyScalar(sandwichShift);
        const localOrigin = child.parent ? child.parent.worldToLocal(worldOrigin.clone()) : worldOrigin.clone();
        const localTarget = child.parent ? child.parent.worldToLocal(targetWorld.clone()) : targetWorld.clone();
        const localDelta = localTarget.sub(localOrigin);

        explodeItems.push({
          obj: child,
          origPos: child.position.clone(),
          deltaVec: localDelta
        });
      });

      statusEl.innerHTML =
        `<strong>Modello caricato</strong> (${meshCount} parti · Asse panino: ${stackAxis.toUpperCase()})<br>` +
        `Rubini ancora/plateau agganciati · Rotazione inversa &amp; zoom`;
    }

    function tryLoadFromIndex(index) {
      if (index >= CANDIDATE_PATHS.length) {
        statusEl.innerHTML = `<span style="color:#ff6b6b;">File <code>ETA_6498-1_Movement_parts.glb</code> non trovato.</span>`;
        return;
      }
      loader.load(
        CANDIDATE_PATHS[index],
        (gltf) => onModelLoaded(gltf),
        (xhr) => {
          if (xhr.total) {
            const pct = Math.round((xhr.loaded / xhr.total) * 100);
            statusEl.innerHTML = `Caricamento: <strong>${pct}%</strong>`;
          }
        },
        () => tryLoadFromIndex(index + 1)
      );
    }

    tryLoadFromIndex(0);

    function applyExplodeState(rawT) {
      const easedT = rawT * rawT * (3 - 2 * rawT);
      for (const item of explodeItems) {
        item.obj.position.copy(item.origPos).addScaledVector(item.deltaVec, easedT);
      }

      if (displayGroup) {
        displayGroup.rotation.set(
          BASE_ROT.x + EXPLODE_ROT_DELTA.x * easedT,
          BASE_ROT.y + EXPLODE_ROT_DELTA.y * easedT,
          BASE_ROT.z + EXPLODE_ROT_DELTA.z * easedT
        );
      }

      const targetDist = BASE_CAM_DIST * (1 + 0.35 * easedT) * userZoomScale;
      const dir = camera.position.clone().sub(controls.target).normalize();
      if (dir.lengthSq() < 0.0001) dir.copy(CAM_DIR);
      camera.position.copy(controls.target).addScaledVector(dir, targetDist);
    }

    const slider = document.getElementById('explodeSlider');
    const sliderVal = document.getElementById('explodeValue');
    slider.addEventListener('input', () => {
      const rawT = parseFloat(slider.value);
      sliderVal.textContent = `${Math.round(rawT * 100)}%`;
      applyExplodeState(rawT);
    });

    const btnRotate = document.getElementById('btnRotate');
    const btnPan = document.getElementById('btnPan');
    const btnAuto = document.getElementById('btnAuto');

    btnRotate.onclick = () => {
      controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
      btnRotate.classList.add('active');
      btnPan.classList.remove('active');
    };
    btnPan.onclick = () => {
      controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
      btnPan.classList.add('active');
      btnRotate.classList.remove('active');
    };
    document.getElementById('btnZoomIn').onclick = () => {
      userZoomScale = Math.max(0.45, userZoomScale * 0.85);
      const rawT = parseFloat(slider.value);
      const easedT = rawT * rawT * (3 - 2 * rawT);
      const targetDist = BASE_CAM_DIST * (1 + 0.35 * easedT) * userZoomScale;
      const dir = camera.position.clone().sub(controls.target).normalize();
      camera.position.copy(controls.target).addScaledVector(dir, targetDist);
    };
    document.getElementById('btnZoomOut').onclick = () => {
      userZoomScale = Math.min(2.2, userZoomScale * 1.18);
      const rawT = parseFloat(slider.value);
      const easedT = rawT * rawT * (3 - 2 * rawT);
      const targetDist = BASE_CAM_DIST * (1 + 0.35 * easedT) * userZoomScale;
      const dir = camera.position.clone().sub(controls.target).normalize();
      camera.position.copy(controls.target).addScaledVector(dir, targetDist);
    };
    btnAuto.onclick = () => {
      controls.autoRotate = !controls.autoRotate;
      btnAuto.classList.toggle('active', controls.autoRotate);
    };
    document.getElementById('btnReset').onclick = () => {
      userZoomScale = 1.0;
      controls.target.set(0, 0, 0);
      const rawT = parseFloat(slider.value);
      const easedT = rawT * rawT * (3 - 2 * rawT);
      if (displayGroup) {
        displayGroup.rotation.set(
          BASE_ROT.x + EXPLODE_ROT_DELTA.x * easedT,
          BASE_ROT.y + EXPLODE_ROT_DELTA.y * easedT,
          BASE_ROT.z + EXPLODE_ROT_DELTA.z * easedT
        );
      }
      camera.position.copy(CAM_DIR).multiplyScalar(BASE_CAM_DIST * (1 + 0.35 * easedT));
      controls.update();
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

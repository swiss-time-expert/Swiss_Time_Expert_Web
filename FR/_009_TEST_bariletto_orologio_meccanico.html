<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bariletto - Orologeria Meccanica</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #ffffff; text-align: center; }
        p { color: #888; margin-bottom: 24px; text-align: center; }
        
        #canvas-container {
            width: 100%;
            max-width: 700px;
            height: 500px;
            background-color: #1a1a1a;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Etichette trasparenti con lettere in blu d'atelier */
        .atelier-label {
            position: absolute;
            display: none;
            background: transparent;
            color: #4a90e2;
            padding: 2px 6px;
            font-size: 12px;
            font-weight: bold;
            font-family: sans-serif;
            pointer-events: none;
            z-index: 10;
            text-shadow: 1px 1px 2px #000, -1px -1px 2px #000;
        }

        .controls-container {
            width: 100%;
            max-width: 700px;
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
        }

        .controls-container label {
            font-size: 14px;
            color: #bbb;
            font-weight: 500;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #d4af37;
            cursor: pointer;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <h1>Il Bariletto dell'Orologio Meccanico</h1>
    <p>Modello 3D interattivo — Vista esplosa con etichette trasparenti d'atelier</p>

    <div id="canvas-container">
        <!-- Etichette trasparenti fluttuanti -->
        <div id="label-arbre" class="atelier-label">1. Arbre & Pignon</div>
        <div id="label-coperchio" class="atelier-label">1. Couvercle</div>
        <div id="label-molla" class="atelier-label">1. Ressort-moteur</div>
        <div id="label-tambour" class="atelier-label">1. Tambour & Roue</div>
    </div>

    <div class="controls-container">
        <label for="exploder">Muovi il cursore per aprire / esplodere il bariletto:</label>
        <input type="range" id="exploder" min="0" max="100" value="0">
    </div>

    <script>
        let scene, camera, renderer, controls;
        let parts = [];

        const container = document.getElementById('canvas-container');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 25, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight1.position.set(20, 40, 20);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x88bbff, 0.6);
            dirLight2.position.set(-20, -20, -20);
            scene.add(dirLight2);

            const loader = new THREE.GLTFLoader();
            // Usiamo il file originario dove l'albero è corretto
            loader.load('../bariletto_orologio_meccanico.main_design.glb', function (gltf) {
                const model = gltf.scene;
                scene.add(model);

                model.traverse((child) => {
                    if (child.isMesh) {
                        const initialPos = child.position.clone();
                        const name = child.name.toLowerCase();
                        
                        let verticalOffset = 0;
                        let labelType = 'tambour';

                        // L'albero rimane fisso al centro come perno d'appoggio
                        if (name.includes('albero') || name.includes('shaft') || name.includes('asse') || name.includes('pinion')) {
                            verticalOffset = 0; 
                            labelType = 'arbre';
                        } else if (name.includes('coperchio') || name.includes('cover')) {
                            verticalOffset = 15; // Coperchio sale
                            labelType = 'coperchio';
                        } else if (name.includes('molla') || name.includes('spring')) {
                            verticalOffset = 5;  // Molla interna
                            labelType = 'molla';
                        } else {
                            verticalOffset = -10; // Tamburo scende
                            labelType = 'tambour';
                        }

                        parts.push({
                            mesh: child,
                            initialPos: initialPos,
                            targetY: initialPos.y + verticalOffset,
                            labelId: 'label-' + labelType
                        });
                    }
                });

                console.log("Componenti caricati correttamente:", parts.length);
            }, undefined, function (error) {
                console.error('Errore nel caricamento del file GLB:', error);
            });

            const slider = document.getElementById('exploder');
            slider.addEventListener('input', (event) => {
                const t = event.target.value / 100;
                updateExplosion(t);
            });

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function updateExplosion(t) {
            parts.forEach(p => {
                p.mesh.position.x = p.initialPos.x;
                p.mesh.position.z = p.initialPos.z;
                p.mesh.position.y = p.initialPos.y + (p.targetY - p.initialPos.y) * t;
            });

            // Mostra le etichette trasparenti se l'esploso è superiore al 5%
            const showLabels = t > 0.05;
            ['label-arbre', 'label-coperchio', 'label-molla', 'label-tambour'].forEach(id => {
                const lbl = document.getElementById(id);
                if (lbl) lbl.style.display = showLabels ? 'block' : 'none';
            });

            if (showLabels) {
                updateLabelsPosition();
            }
        }

        function updateLabelsPosition() {
            parts.forEach(p => {
                const lbl = document.getElementById(p.labelId);
                if (!lbl || lbl.style.display === 'none') return;

                const tempV = p.mesh.position.clone();
                tempV.project(camera);

                const x = (tempV.x *  .5 + .5) * container.clientWidth;
                const y = (tempV.y * -.5 + .5) * container.clientHeight;

                lbl.style.left = (x - 20) + 'px';
                lbl.style.top = (y - 10) + 'px';
            });
        }

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);

            const slider = document.getElementById('exploder');
            if (slider && slider.value > 5) {
                updateLabelsPosition();
            }
        }

        init();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bariletto - Orologeria Meccanica</title>
    <!-- Importiamo lo script ufficiale di Google per il visualizzatore 3D -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #ffffff; text-align: center; }
        p { color: #888; margin-bottom: 24px; text-align: center; }
        
        /* Stile del box 3D */
        model-viewer {
            width: 100%;
            max-width: 700px;
            height: 500px;
            background-color: #1a1a1a;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        /* Stile per il pannello del cursore (stile Schiantoski) */
        .controls-container {
            width: 100%;
            max-width: 700px;
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
        }

        .controls-container label {
            font-size: 14px;
            color: #bbb;
            font-weight: 500;
        }

        /* La "barra volume" / slider personalizzata */
        input[type="range"] {
            width: 100%;
            accent-color: #d4af37; /* Colore oro elegante stile orologeria */
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Il Bariletto dell'Orologio Meccanico</h1>
    <p>Modello 3D interattivo in scala reale (diametro 11 mm, 80 denti a evolvente)</p>

    <!-- Visualizzatore 3D con percorso che punta alla radice -->
    <model-viewer 
        id="bariletto-viewer"
        src="../bariletto_orologio_meccanico.main_design.glb" 
        alt="Bariletto orologio meccanico" 
        camera-controls 
        shadow-intensity="1"
        exposure="1"
        camera-orbit="45deg 55deg 2.5m">
    </model-viewer>

    <!-- Pannello di controllo con il cursore stile Schiantoski -->
    <div class="controls-container">
        <label for="exploder">Muovi il cursore per aprire / esplodere il bariletto:</label>
        <input type="range" id="exploder" min="0" max="100" value="0">
    </div>

    <script>
        // Script di interazione per collegare il cursore al modello 3D
        const viewer = document.querySelector('#bariletto-viewer');
        const slider = document.querySelector('#exploder');

        slider.addEventListener('input', (event) => {
            const progress = event.target.value / 100;
            // Qui potremo mappare il movimento del cursore sull'animazione o sullo spostamento dei pezzi
            console.log("Valore cursore:", progress);
        });
    </script>

</body>
</html>

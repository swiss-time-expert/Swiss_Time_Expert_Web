<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Tourbillon 3D — Swiss Time Expert</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f4f6f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1e293b;
    }

    #tourbillon-wrapper {
      position: relative;
      width: 100%;
      max-width: 1120px;
      height: 640px;
      margin: 0 auto;
      background: radial-gradient(circle at center, #253446 0%, #111822 100%);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.24);
    }

    #tourbillon-wrapper:fullscreen {
      max-width: none;
      width: 100vw;
      height: 100vh;
      border-radius: 0;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    #btn-fullscreen {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.82);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.2s ease, transform 0.15s ease;
    }

    #btn-fullscreen:hover {
      background: rgba(30, 41, 59, 0.96);
    }

    #btn-fullscreen:active {
      transform: scale(0.98);
    }

    .controls-bar {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 14px;
      width: min(92%, 580px);
      background: rgba(15, 23, 42, 0.85);
      color: #f8fafc;
      padding: 11px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .controls-bar label {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      user-select: none;
    }

    #explode-slider {
      flex: 1;
      accent-color: #eab308;
      cursor: pointer;
    }

    #explode-value {
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      min-width: 40px;
      text-align: right;
      color: #facc15;
      font-weight: 700;
    }

    #status-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      color: #cbd5e1;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }

    .credits-box {
      max-width: 1120px;
      margin: 12px auto 0;
      font-size: 13px;
      color: #475569;
    }

    .credits-box a {
      color: #1d4ed8;
      text-decoration: underline;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="tourbillon-wrapper">
    <div id="status-msg">Chargement du modèle 3D…</div>
    <button id="btn-fullscreen" type="button">⛶ Plein écran</button>
    <div id="canvas-container"></div>

    <div class="controls-bar">
      <label for="explode-slider">Vue éclatée (Axe des pignons)</label>
      <input id="explode-slider" type="range" min="0" max="100" value="0" />
      <span id="explode-value">0%</span>
    </div>
  </div>

  <div class="credits-box">
    Modèle 3D : « Tourbillon » par banyuanxui via
    <a href="https://grabcad.com/" target="_blank" rel="noopener noreferrer">GrabCAD</a>
    (Usage éducatif / non commercial).
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const wrapper = document.getElementById('tourbillon-wrapper');
    const container = document.getElementById('canvas-container');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const slider = document.getElementById('explode-slider');
    const valueLabel = document.getElementById('explode-value');
    const statusMsg = document.getElementById('status-msg');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      40,
      container.clientWidth / container.clientHeight,
      0.001,
      1000
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    const parts = [];
    const loader = new GLTFLoader();

    loader.load(
      '../tourbillon_web.glb',
      (gltf) => {
        const model = gltf.scene;
        scene.add(model);

        model.updateMatrixWorld(true);

        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z) || 1;

        camera.near = maxDim / 500;
        camera.far = maxDim * 100;
        camera.position.set(center.x, center.y, center.z + maxDim * 2.1);
        camera.updateProjectionMatrix();

        controls.target.copy(center);
        controls.update();

        model.traverse((child) => {
          if (child.isMesh) {
            const meshBox = new THREE.Box3().setFromObject(child);
            const meshCenter = meshBox.getCenter(new THREE.Vector3());

            parts.push({
              mesh: child,
              startPos: child.position.clone(),
              deltaZ: meshCenter.z - center.z
            });
          }
        });

        statusMsg.style.display = 'none';
      },
      undefined,
      (error) => {
        console.error('Erreur chargement GLB:', error);
        statusMsg.textContent = 'Erreur lors du chargement de tourbillon_web.glb';
      }
    );

    slider.addEventListener('input', () => {
      const pct = Number(slider.value);
      valueLabel.textContent = pct + '%';

      // Regola qui la corsa dell'esploso lungo l'asse dei pignoni (Z)
      const spreadFactor = (pct / 100) * 2.2;

      for (const item of parts) {
        item.mesh.position.copy(item.startPos);
        item.mesh.updateMatrixWorld(true);

        const targetWorldPos = item.mesh.getWorldPosition(new THREE.Vector3());
        targetWorldPos.z += item.deltaZ * spreadFactor;

        if (item.mesh.parent) {
          item.mesh.position.copy(item.mesh.parent.worldToLocal(targetWorldPos));
        } else {
          item.mesh.position.copy(targetWorldPos);
        }
      }
    });

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        wrapper.requestFullscreen().catch((err) => console.error(err));
      } else {
        document.exitFullscreen();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      btnFullscreen.textContent = document.fullscreenElement
        ? '✕ Quitter plein écran'
        : '⛶ Plein écran';
      onResize();
    });

    function onResize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      if (!w || !h) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    window.addEventListener('resize', onResize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

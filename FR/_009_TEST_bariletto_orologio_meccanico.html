<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bariletto - Orologeria Meccanica [TEST 007]</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #1a365d; text-align: center; }
        p { color: #666; margin-bottom: 24px; text-align: center; }
        
        #canvas-container {
            width: 100%;
            max-width: 700px;
            height: 500px;
            background-color: #ffffff;
            border: 1px solid #dcdcdc;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Etichette trasparenti con lettere in blu d'atelier sincronizzate */
        .atelier-label {
            position: absolute;
            display: none;
            background: transparent;
            color: #1a365d;
            padding: 2px 6px;
            font-size: 12px;
            font-weight: bold;
            font-family: sans-serif;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(255,255,255,0.9), 0 -1px 2px rgba(255,255,255,0.9);
            transform: translate(-50%, -50%);
        }

        .controls-container {
            width: 100%;
            max-width: 700px;
            background-color: #ffffff;
            border: 1px solid #dcdcdc;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
        }

        .controls-container label {
            font-size: 14px;
            color: #1a365d;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #1a365d;
            cursor: pointer;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <h1>Il Bariletto dell'Orologio Meccanico <span style="color: #d9534f; font-size: 18px;">[TEST 007]</span></h1>
    <p>Modello 3D interattivo — Diagnostica Mesh in Console & Esploso Verticale</p>

    <div id="canvas-container">
        <!-- Etichette trasparenti fluttuanti con testo blu d'atelier -->
        <div id="label-arbre" class="atelier-label">1. Arbre & Pignon</div>
        <div id="label-coperchio" class="atelier-label">1. Couvercle</div>
        <div id="label-molla" class="atelier-label">1. Ressort-moteur</div>
        <div id="label-tambour" class="atelier-label">1. Tambour & Roue</div>
    </div>

    <div class="controls-container">
        <label for="exploder">Muovi il cursore per aprire / esplodere il bariletto (TEST 007) :</label>
        <input type="range" id="exploder" min="0" max="100" value="0">
    </div>

    <script>
        let scene, camera, renderer, controls;
        let parts = [];
        let currentExplosionProgress = 0;

        const container = document.getElementById('canvas-container');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 25, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight1.position.set(20, 40, 20);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x88bbff, 0.6);
            dirLight2.position.set(-20, -20, -20);
            scene.add(dirLight2);

            const loader = new THREE.GLTFLoader();
            loader.load('../bariletto_orologio_meccanico.main_design.glb', function (gltf) {
                const model = gltf.scene;
                scene.add(model);

                console.group("🔍 DIAGNOSTICA MESH GLB (TEST 007)");
                model.traverse((child) => {
                    if (child.isMesh) {
                        const initialPos = child.position.clone();
                        const name = child.name ? child.name.toLowerCase() : "senza_nome";
                        
                        // Stampa in console i dettagli di ogni mesh trovata
                        console.log(`Mesh trovata: "${child.name}" | Posizione Y: ${initialPos.y.toFixed(2)}`);

                        let verticalOffset = 0;
                        let labelType = 'tambour';

                        // Regole di esploso verticale (asse Y)
                        if (name.includes('albero') || name.includes('shaft') || name.includes('asse') || name.includes('pinion')) {
                            verticalOffset = 0; 
                            labelType = 'arbre';
                        } else if (name.includes('coperchio') || name.includes('cover')) {
                            verticalOffset = 18; 
                            labelType = 'coperchio';
                        } else if (name.includes('molla') || name.includes('spring')) {
                            verticalOffset = 6;  
                            labelType = 'molla';
                        } else {
                            verticalOffset = -15; 
                            labelType = 'tambour';
                        }

                        parts.push({
                            mesh: child,
                            initialPos: initialPos,
                            targetY: initialPos.y + verticalOffset,
                            labelId: 'label-' + labelType
                        });
                    }
                });
                console.groupEnd();

                console.log("Totale parti gestite nell'esploso:", parts.length);
            }, undefined, function (error) {
                console.error('Errore nel caricamento del file GLB:', error);
            });

            const slider = document.getElementById('exploder');
            slider.addEventListener('input', (event) => {
                currentExplosionProgress = event.target.value / 100;
                updateExplosion(currentExplosionProgress);
            });

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function updateExplosion(t) {
            parts.forEach(p => {
                // Spostamento rigorosamente verticale sull'asse Y
                p.mesh.position.x = p.initialPos.x;
                p.mesh.position.y = p.initialPos.y + (p.targetY - p.initialPos.y) * t;
                p.mesh.position.z = p.initialPos.z;
            });
        }

        function updateLabelsPosition() {
            const showLabels = currentExplosionProgress > 0.05;
            
            ['label-arbre', 'label-coperchio', 'label-molla', 'label-tambour'].forEach(id => {
                const lbl = document.getElementById(id);
                if (lbl) lbl.style.display = showLabels ? 'block' : 'none';
            });

            if (!showLabels) return;

            parts.forEach(p => {
                const lbl = document.getElementById(p.labelId);
                if (!lbl) return;

                const tempV = p.mesh.position.clone();
                tempV.project(camera);

                const x = (tempV.x *  .5 + .5) * container.clientWidth;
                const y = (tempV.y * -.5 + .5) * container.clientHeight;

                lbl.style.left = x + 'px';
                lbl.style.top = (y - 15) + 'px';
            });
        }

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);

            updateLabelsPosition();
        }

        init();
    </script>

</body>
</html>

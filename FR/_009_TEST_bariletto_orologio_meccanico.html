<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test 3D - ETA 6498-1 Movement Parts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #141619;
      color: #f0f2f5;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #viewer {
      width: 100%;
      height: 100%;
      display: block;
    }
    #status {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(20, 22, 25, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 12px 15px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.45;
      max-width: 420px;
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    #status code {
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
    }
    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 22, 25, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 18px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 10;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      font-size: 13px;
      font-weight: 600;
    }
    input[type="range"] {
      flex: 1;
      accent-color: #d4af37;
      cursor: pointer;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: #262a30;
      color: #f0f2f5;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: #323840; }
    button.active {
      background: #c99e28;
      color: #111;
      border-color: #e0b94b;
      font-weight: 600;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="status">Ricerca e caricamento di <code>ETA_6498-1_Movement_parts.glb</code>...</div>
  <div id="viewer"></div>

  <div id="controls">
    <div class="slider-row">
      <span>Vue Éclatée :</span>
      <input id="explodeSlider" type="range" min="0" max="1" step="0.005" value="0" />
      <span id="explodeValue">0%</span>
    </div>
    <div class="btn-row">
      <button id="btnRotate" class="active">Pivoter</button>
      <button id="btnPan">Déplacer</button>
      <button id="btnZoomIn">+ Zoom</button>
      <button id="btnZoomOut">- Zoom</button>
      <button id="btnAuto">Auto</button>
      <button id="btnReset">Centrer</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const CANDIDATE_PATHS = [
      './ETA_6498-1_Movement_parts.glb',
      '../ETA_6498-1_Movement_parts.glb',
      '/ETA_6498-1_Movement_parts.glb',
      './ETA 6498-1 Movement parts.glb',
      '../ETA 6498-1 Movement parts.glb',
      '/ETA 6498-1 Movement parts.glb'
    ];

    const statusEl = document.getElementById('status');
    const container = document.getElementById('viewer');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181b20);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.set(2.4, 2.0, 2.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.8;
    container.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.4);
    dirLight1.position.set(4, 6, 5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xdde6ff, 0.9);
    dirLight2.position.set(-5, -3, -4);
    scene.add(dirLight2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    let modelRoot = null;
    const explodeItems = [];
    const loader = new GLTFLoader();

    function onModelLoaded(gltf, resolvedPath) {
      modelRoot = gltf.scene;
      scene.add(modelRoot);

      const box = new THREE.Box3().setFromObject(modelRoot);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);

      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const scaleFactor = 2.45 / maxDim;
      modelRoot.scale.setScalar(scaleFactor);

      box.setFromObject(modelRoot);
      box.getCenter(center);
      modelRoot.position.sub(center);

      const normSize = new THREE.Vector3();
      box.getSize(normSize);
      const minAxis = (normSize.z <= normSize.x && normSize.z <= normSize.y) ? 'z'
                    : (normSize.y <= normSize.x && normSize.y <= normSize.z) ? 'y' : 'x';

      let meshCount = 0;
      modelRoot.traverse((child) => {
        if (child.isMesh) {
          meshCount++;
          if (child.material) {
            child.material.side = THREE.DoubleSide;
            child.material.needsUpdate = true;
          }
          const meshBox = new THREE.Box3().setFromObject(child);
          const meshCenter = new THREE.Vector3();
          meshBox.getCenter(meshCenter);

          const offset = meshCenter[minAxis];
          explodeItems.push({
            obj: child,
            origPos: child.position.clone(),
            axis: minAxis,
            factor: offset * 2.8
          });
        }
      });

      statusEl.innerHTML =
        `<strong>Modello caricato!</strong><br>` +
        `File: <code>${resolvedPath}</code><br>` +
        `Parti/Mesh rilevate: <strong>${meshCount}</strong> | Asse esploso: <strong>${minAxis.toUpperCase()}</strong>`;
    }

    function tryLoadFromIndex(index) {
      if (index >= CANDIDATE_PATHS.length) {
        statusEl.innerHTML =
          `<span style="color:#ff6b6b;"><strong>File .glb non trovato</strong> in nessuno dei percorsi provati:</span><br>` +
          CANDIDATE_PATHS.map(p => `<code>${p}</code>`).join(', ') +
          `<br><br>Verifica su GitHub che il file sia stato caricato (e non sia rimasto solo nella cartella locale o con altro nome).`;
        return;
      }

      const currentPath = CANDIDATE_PATHS[index];
      statusEl.innerHTML = `Tentativo di caricamento da <code>${currentPath}</code>...`;

      loader.load(
        currentPath,
        (gltf) => onModelLoaded(gltf, currentPath),
        (xhr) => {
          if (xhr.total) {
            const pct = Math.round((xhr.loaded / xhr.total) * 100);
            statusEl.innerHTML = `Caricamento da <code>${currentPath}</code>: <strong>${pct}%</strong>`;
          }
        },
        () => {
          tryLoadFromIndex(index + 1);
        }
      );
    }

    tryLoadFromIndex(0);

    const slider = document.getElementById('explodeSlider');
    const sliderVal = document.getElementById('explodeValue');
    slider.addEventListener('input', () => {
      const t = parseFloat(slider.value);
      sliderVal.textContent = `${Math.round(t * 100)}%`;
      for (const item of explodeItems) {
        item.obj.position.copy(item.origPos);
        item.obj.position[item.axis] += (item.factor * t) / (modelRoot ? modelRoot.scale.x : 1);
      }
    });

    const btnRotate = document.getElementById('btnRotate');
    const btnPan = document.getElementById('btnPan');
    const btnAuto = document.getElementById('btnAuto');

    btnRotate.onclick = () => {
      controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
      btnRotate.classList.add('active');
      btnPan.classList.remove('active');
    };
    btnPan.onclick = () => {
      controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
      btnPan.classList.add('active');
      btnRotate.classList.remove('active');
    };
    document.getElementById('btnZoomIn').onclick = () => {
      camera.position.multiplyScalar(0.85);
    };
    document.getElementById('btnZoomOut').onclick = () => {
      camera.position.multiplyScalar(1.18);
    };
    btnAuto.onclick = () => {
      controls.autoRotate = !controls.autoRotate;
      btnAuto.classList.toggle('active', controls.autoRotate);
    };
    document.getElementById('btnReset').onclick = () => {
      camera.position.set(2.4, 2.0, 2.8);
      controls.target.set(0, 0, 0);
      controls.update();
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

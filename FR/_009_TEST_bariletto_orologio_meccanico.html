<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Tourbillon 3D — Swiss Time Expert</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f4f6f9;
      font-family: system-ui, -apple-system, sans-serif;
      color: #1e293b;
    }

    #tourbillon-wrapper {
      position: relative;
      width: 100%;
      max-width: 1100px;
      height: 620px;
      margin: 0 auto;
      background: radial-gradient(circle at center, #263547 0%, #151e29 100%);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
    }

    /* Quando è attivo il Tutto Schermo */
    #tourbillon-wrapper:fullscreen {
      max-width: none;
      width: 100vw;
      height: 100vh;
      border-radius: 0;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    /* Pulsante Fullscreen in alto a destra */
    #btn-fullscreen {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.78);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.2s;
    }

    #btn-fullscreen:hover {
      background: rgba(30, 41, 59, 0.95);
    }

    /* Barra di controllo Esploso in basso */
    .controls-bar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 14px;
      width: min(90%, 540px);
      background: rgba(15, 23, 42, 0.82);
      color: #f8fafc;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
    }

    .controls-bar label {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    #explode-slider {
      flex: 1;
      accent-color: #d4af37;
      cursor: pointer;
    }

    #explode-value {
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      min-width: 38px;
      text-align: right;
      color: #facc15;
      font-weight: 600;
    }
  </style>

  <!-- Import map per Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="tourbillon-wrapper">
    <button id="btn-fullscreen" type="button">⛶ Plein écran</button>
    <div id="canvas-container"></div>

    <div class="controls-bar">
      <label for="explode-slider">Vue éclatée (Axe X)</label>
      <input id="explode-slider" type="range" min="0" max="100" value="0" />
      <span id="explode-value">0%</span>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const wrapper = document.getElementById('tourbillon-wrapper');
    const container = document.getElementById('canvas-container');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const slider = document.getElementById('explode-slider');
    const valueLabel = document.getElementById('explode-value');

    // 1. Scena, Camera e Renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.01, 100);
    camera.position.set(0, 0.15, 0.45);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    // Ambiente riflettente per esaltare acciaio, oro, blu e rubini
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    // 2. Caricamento del modello e preparazione esploso sull'asse orizzontale (X)
    const parts = [];
    const loader = new GLTFLoader();

    // MODIFICA QUI il percorso se tourbillon_web.glb è in un'altra sottocartella
   loader.load('../tourbillon_web.glb', (gltf) => {
      const model = gltf.scene;
      scene.add(model);

      // Calcola il centro complessivo del modello
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);

      // Adatta la distanza della camera alle dimensioni reali del modello
      camera.position.set(center.x, center.y + maxDim * 0.2, center.z + maxDim * 1.9);
      controls.target.copy(center);
      controls.update();

      // Registra ogni singola mesh e la sua posizione di partenza rispetto al centro
      model.updateMatrixWorld(true);
      model.traverse((child) => {
        if (child.isMesh) {
          const meshBox = new THREE.Box3().setFromObject(child);
          const meshCenter = meshBox.getCenter(new THREE.Vector3());

          // Distanza del singolo pezzo dal centro lungo l'asse X (orizzontale)
          const deltaX = meshCenter.x - center.x;

          parts.push({
            mesh: child,
            baseX: child.position.x,
            offsetX: deltaX
          });
        }
      });
    });

    // 3. Controllo Slider Esploso (0% -> 100%)
    slider.addEventListener('input', () => {
      const pct = Number(slider.value);
      valueLabel.textContent = pct + '%';

      // Fattore di apertura (aumenta a 2.5 o 3.0 se vuoi un esploso più ampio)
      const spreadFactor = (pct / 100) * 2.2;

      for (const item of parts) {
        item.mesh.position.x = item.baseX + item.offsetX * spreadFactor;
      }
    });

    // 4. Gestione Fullscreen
    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        wrapper.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      btnFullscreen.textContent = document.fullscreenElement ? '✕ Quitter plein écran' : '⛶ Plein écran';
      onResize();
    });

    // 5. Resize responsive e ciclo di rendering
    function onResize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    window.addEventListener('resize', onResize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
